>\n<div class=\"photo-frame-mat\">\n<img alt=\"Seunghyeon Lee\" onerror=\"this.parentElement.classList.add('is-empty')\" src=\"assets/images/profile.jpg\"/>\n</div>\n</figure>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ ABOUT ══ -->\n<section id=\"about\">\n<div class=\"sec-label\">About Me</div>\n<h2>Hi, I'm Seunghyeon</h2>\n<div class=\"about-split fade\">\n<div class=\"about-split-text\">\n<div class=\"about-body\">\n<p>I’m interested in <span class=\"highlight\">using data to understand what drives people, businesses, and real-world outcomes</span>.</p>\n<p>I enjoy turning ambiguous problems into clear questions, then translating analysis into decisions and practical solutions.</p>\n<p>My work centers on <span class=\"highlight\">customer behavior, e-commerce, and HCI</span>, using methods ranging from text mining and machine learning to spatial analysis, optimization, and BI.</p>\n<div class=\"career-timeline\">\n<div class=\"ct-item\">\n<div class=\"ct-dot\"></div>\n<div class=\"ct-year\">2021 – 2025</div>\n<div class=\"ct-label\">Yonsei University Mirae Campus (B.S.)</div>\n<div class=\"ct-desc\">B.S. Data Science &amp; Biotechnology</div>\n</div>\n<div class=\"ct-item ct-item--last\">\n<div class=\"ct-dot ct-dot--accent\"></div>\n<div class=\"ct-year\">2025 – Present</div>\n<div class=\"ct-label\">Yonsei Graduate School of Information (M.S.)</div>\n<div class=\"ct-desc\">M.S. Information Systems</div>\n</div>\n</div>\n</div>\n</div>\n<div class=\"about-split-photo\">\n<div class=\"about-photo-fallback\">ABOUT PHOTO</div>\n<img alt=\"Seunghyeon Lee, Yonsei University graduation\" onerror=\"this.remove()\" src=\"assets/images/about-graduation.jpg\"/>\n<div class=\"about-photo-caption\">Yonsei University · Graduation, 2025</div>\n</div>\n</div>\n<div class=\"block-label\">Research Interests</div>\n<div class=\"interest-row\">\n<span class=\"interest fade\">Customer Behavior</span>\n<span class=\"interest fade\">E-commerce Analytics</span>\n<span class=\"interest fade\">AI Agents</span>\n<span class=\"interest fade\">Human–AI Interaction</span>\n</div>\n<div class=\"block-label\">How I Work</div>\n<p class=\"hiw-intro\">How I move from problem framing to analysis, validation, and delivery.</p>\n<p class=\"click-hint\">\n<span aria-hidden=\"true\" class=\"click-hint-icon\">\n<svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\">\n<path d=\"M9 4.5a1.6 1.6 0 0 1 3.2 0v6\"></path>\n<path d=\"M12.2 10.6V9a1.6 1.6 0 0 1 3.2 0v1.9\"></path>\n<path d=\"M15.4 11.2v-.9a1.6 1.6 0 0 1 3.2 0v5.2a5.4 5.4 0 0 1-5.4 5.4h-1.4a5 5 0 0 1-3.9-1.9L5 15.4a1.6 1.6 0 0 1 2.5-2l1.5 1.8\"></path>\n</svg>\n</span>\n    Click each step to learn more.\n  </p>\n<div class=\"hiw-wrap fade\">\n<div class=\"hiw-list\">\n<div class=\"hiw-item\" onclick=\"toggleHiw(this)\">\n<div class=\"hiw-trigger\">\n<div class=\"hiw-trigger-left\">\n<div class=\"hiw-step\">Step 01. Listen &amp; Frame</div>\n<div class=\"hiw-title\">Frame the right problem by connecting different perspectives</div>\n</div>\n<div class=\"hiw-chevron\">⌄</div>\n</div>\n<div class=\"hiw-body\">\n<img alt=\"Fintech company visit and project discussion\" class=\"hiw-item-photo\" loading=\"lazy\" src=\"assets/images/how-01.jpg\"/>\n<div class=\"hiw-body-inner\">I listen to users, practitioners, and researchers, align different perspectives, and turn them into a clear problem statement and direction.</div>\n</div>\n</div>\n<div class=\"hiw-item\" onclick=\"toggleHiw(this)\">\n<div class=\"hiw-trigger\">\n<div class=\"hiw-trigger-left\">\n<div class=\"hiw-step\">Step 02. Analyze &amp; Validate</div>\n<div class=\"hiw-title\">Validate assumptions with data and field evidence</div>\n</div>\n<div class=\"hiw-chevron\">⌄</div>\n</div>\n<div class=\"hiw-body\">\n<img alt=\"Project data visualization\" class=\"hiw-item-photo\" loading=\"lazy\" src=\"assets/images/how-02.jpg\"/>\n<div class=\"hiw-body-inner\">I combine quantitative analysis with interviews and practitioner feedback to test whether the findings hold up in the real world.</div>\n</div>\n</div>\n<div class=\"hiw-item\" onclick=\"toggleHiw(this)\">\n<div class=\"hiw-trigger\">\n<div class=\"hiw-trigger-left\">\n<div class=\"hiw-step\">Step 03. Translate &amp; Deliver</div>\n<div class=\"hiw-title\">Turn analysis into decisions, products, and action</div>\n</div>\n<div class=\"hiw-chevron\">⌄</div>\n</div>\n<div class=\"hiw-body\">\n<img alt=\"International conference presentation\" class=\"hiw-item-photo\" loading=\"lazy\" src=\"assets/images/how-03.jpg\"/>\n<div class=\"hiw-body-inner\">I turn findings into clear decision criteria, operating plans, and service prototypes that people can actually use.</div>\n</div>\n</div>\n</div>\n<div class=\"hiw-photo-panel\">\n<img alt=\"Listen &amp; Frame\" class=\"hiw-photo active\" id=\"hphoto-0\" src=\"assets/images/how-01.jpg\"/>\n<img alt=\"Analyze &amp; Validate\" class=\"hiw-photo\" id=\"hphoto-1\" src=\"assets/images/how-02.jpg\"/>\n<img alt=\"Translate &amp; Deliver\" class=\"hiw-photo\" id=\"hphoto-2\" src=\"assets/images/how-03.jpg\"/>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ EDUCATION ══ -->\n<section id=\"education\">\n<div class=\"sec-label\">Education</div>\n<h2>Academic Background</h2>\n<p class=\"sec-sub\">I studied Data Science and Biotechnology and now focus on customer behavior and human–AI interaction.</p>\n<div class=\"exp-list\">\n<div class=\"exp-item fade\">\n<div class=\"exp-meta\">\n<div class=\"exp-logo-row\">\n<img alt=\"Yonsei University\" class=\"exp-logo\" onerror=\"this.remove()\" src=\"assets/images/logo-yonsei.png\"/>\n<div>\n<div class=\"exp-org\">Yonsei Graduate School of Information</div>\n<div class=\"exp-loc\">Seoul, Korea</div>\n</div>\n</div>\n<div class=\"exp-date\">Sep 2025 – Present</div>\n</div>\n<div>\n<div class=\"exp-title\">M.S. Information Systems</div>\n<ul class=\"exp-items\">\n<li><strong>Thesis :</strong> Clickstream-based customer behavior research; comparative analysis of perceptions across AI types</li>\n<li><strong>Focus areas :</strong> ML/DL, NLP, AI Agent, Prediction modeling</li>\n</ul>\n</div>\n</div>\n<div class=\"exp-item fade\">\n<div class=\"exp-meta\">\n<div class=\"exp-logo-row\">\n<img alt=\"Yonsei University\" class=\"exp-logo\" onerror=\"this.remove()\" src=\"assets/images/logo-yonsei.png\"/>\n<div>\n<div class=\"exp-org\">Yonsei University Mirae Campus</div>\n<div class=\"exp-loc\">Gangwon-do, Korea</div>\n</div>\n</div>\n<div class=\"exp-date\">Mar 2021 – Aug 2025</div>\n</div>\n<div>\n<div class=\"exp-title\">B.S. Data Science &amp; Biotechnology</div>\n<ul class=\"exp-items\">\n<li>Double major bridging Data Science and Biotechnology - the intersection that led me to data</li>\n<li>Research internship at the Bio-Computing Lab, Department of Software</li>\n<li>Participated in the Cambridge UK Global Entrepreneurship Camp</li>\n</ul>\n<div class=\"course-block\">\n<div class=\"course-group\">\n<div class=\"course-label\">Statistics &amp; Analytics</div>\n<div class=\"course-tags\">\n<span class=\"course\">Mathematical Statistics</span><span class=\"course\">Regression Analysis</span>\n<span class=\"course\">Multivariate Data Analysis</span><span class=\"course\">Statistical Data Analysis</span>\n<span class=\"course\">Nonparametric Statistics</span><span class=\"course\">Applied Probability &amp; Statistics</span>\n<span class=\"course\">Introduction to Statistics</span>\n</div>\n</div>\n<div class=\"course-group\">\n<div class=\"course-label\">Data Science &amp; Programming</div>\n<div class=\"course-tags\">\n<span class=\"course\">Database</span><span class=\"course\">Linear Algebra</span>\n<span class=\"course\">Data Mining</span><span class=\"course\">Data Science Software Lab</span>\n<span class=\"course\">Computer Programming</span><span class=\"course\">Java Programming</span>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ TOOLS & METHODS ══ -->\n<section id=\"skills\">\n<div class=\"sec-label\">Tools &amp; Methods</div>\n<h2>What I work with</h2>\n<p class=\"sec-sub\">I work end to end—from data collection and analysis to modeling, visualization, and decision support.</p>\n<div class=\"skills-grid\">\n<div class=\"skill-card fade\">\n<div class=\"skill-card-title\">Programming &amp; Data Analysis</div>\n<div class=\"skill-tags\">\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg\"/>Python</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg\"/>SQL</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/r/r-original.svg\"/>R</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/pandas/pandas-original.svg\"/>pandas</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/numpy/numpy-original.svg\"/>NumPy</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jupyter/jupyter-original.svg\"/>Jupyter</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg\"/>Git</span>\n</div>\n</div>\n<div class=\"skill-card fade\">\n<div class=\"skill-card-title\">Machine Learning &amp; Modeling</div>\n<div class=\"skill-tags\">\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/scikitlearn/scikitlearn-original.svg\"/>scikit-learn</span>\n<span class=\"skill-tag\">Logistic Regression</span>\n<span class=\"skill-tag\">Random Forest</span>\n<span class=\"skill-tag\">XGBoost</span>\n<span class=\"skill-tag\">K-Means</span>\n<span class=\"skill-tag\">Hierarchical Clustering</span>\n<span class=\"skill-tag\">PCA</span>\n</div>\n</div>\n<div class=\"skill-card fade\">\n<div class=\"skill-card-title\">NLP &amp; Text Mining</div>\n<div class=\"skill-tags\">\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/huggingface\"/>BERTopic</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/huggingface\"/>SentenceTransformers</span>\n<span class=\"skill-tag\">UMAP</span>\n<span class=\"skill-tag\">HDBSCAN</span>\n</div>\n</div>\n<div class=\"skill-card fade\">\n<div class=\"skill-card-title\">Data Visualization &amp; BI</div>\n<div class=\"skill-tags\">\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/powerbi\"/>Power BI</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/tableau\"/>Tableau</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.jsdelivr.net/gh/devicons/devicon/icons/matplotlib/matplotlib-original.svg\"/>Matplotlib</span>\n</div>\n</div>\n<div class=\"skill-card fade\">\n<div class=\"skill-card-title\">GIS &amp; Spatial Analysis</div>\n<div class=\"skill-tags\">\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/esri\"/>ArcGIS</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/qgis\"/>QGIS</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"https://cdn.simpleicons.org/geopandas\"/>GeoPandas</span>\n<span class=\"skill-tag\"><img alt=\"\" onerror=\"this.remove()\" src=\"assets/images/icon-satellite.svg\"/>Landsat</span>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ 01. RESEARCH PAPERS ══ -->\n<section id=\"research\">\n<div class=\"sec-label\">Research &amp; Projects - 01</div>\n<h2>Research</h2>\n<p class=\"sec-sub\">Research that uses data to test behavioral and technology-focused questions.</p>\n<p class=\"disclosure-line\">※ Some methodological details are withheld while the manuscripts are in preparation.</p>\n<div class=\"card-grid\">\n<div class=\"pcard fade\" onclick=\"openModal('paper-churn')\" style=\"cursor:pointer\">\n<div class=\"pcard-img\">\n<img alt=\"Customer Behavior &amp; Churn Analysis\" onerror=\"this.style.display='none'\" src=\"assets/images/thumb-churn.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Research 01</div>\n<div class=\"pname\">Customer Behavior &amp; Churn Analysis</div>\n<div class=\"pdesc\">Using clickstream page transitions to predict <span class=\"hl\">where customers drop off along the purchase journey</span>.</div>\n<div class=\"kw-block\">\n<div class=\"kw-row\"><span class=\"kw-label\">Domain</span><div class=\"kw-tags\"><span class=\"ptag-dom\">E-commerce</span><span class=\"ptag-dom\">Customer Behavior</span></div></div>\n<div class=\"kw-row\"><span class=\"kw-label\">Method</span><div class=\"kw-tags\"><span class=\"ptag-met\">Clickstream Analysis</span><span class=\"ptag-met\">Customer Segmentation</span><span class=\"ptag-met\">Churn Prediction</span></div></div>\n</div>\n<div class=\"plink\">View Study →</div>\n</div>\n</div>\n<div class=\"pcard fade\" onclick=\"openModal('paper-ai')\" style=\"cursor:pointer\">\n<div class=\"pcard-img\">\n<img alt=\"AI Perception Analysis\" onerror=\"this.style.display='none'\" src=\"assets/images/thumb-ai.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Research 02</div>\n<div class=\"pname\">AI Perception Analysis</div>\n<div class=\"pdesc\">Comparing <span class=\"hl\">how perceived value and risk vary across AI types and information sources</span> using news and online community discourse.</div>\n<div class=\"kw-block\">\n<div class=\"kw-row\"><span class=\"kw-label\">Domain</span><div class=\"kw-tags\"><span class=\"ptag-dom\">AI Perception</span><span class=\"ptag-dom\">Public Discourse</span></div></div>\n<div class=\"kw-row\"><span class=\"kw-label\">Method</span><div class=\"kw-tags\"><span class=\"ptag-met\">Web Crawling</span><span class=\"ptag-met\">Topic Modeling</span><span class=\"ptag-met\">Text Embedding</span></div></div>\n</div>\n<div class=\"plink\">View Study →</div>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ 02. SELECTED PROJECTS ══ -->\n<section id=\"projects\">\n<div class=\"sec-label\">Research &amp; Projects - 02</div>\n<h2>Selected Projects</h2>\n<p class=\"sec-sub\">Selected work that starts with real-world problems and turns analysis into practical decisions, services, and products.</p>\n<div class=\"card-grid\">\n<div class=\"pcard fade\" onclick=\"openModal('flood')\" style=\"cursor:pointer\">\n<div class=\"pcard-img\">\n<img alt=\"Flood Risk Modeling\" onerror=\"this.style.display='none'\" src=\"assets/images/thumb-flood.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">2025</div>\n<div class=\"pname\">Flood Risk Modeling</div>\n<div class=\"pdesc\">Reassessed local flood risk under climate change and translated the findings into <span class=\"hl\">risk-based pricing and compensation design</span>.</div>\n<div class=\"kw-block\">\n<div class=\"kw-row\"><span class=\"kw-label\">Domain</span><div class=\"kw-tags\"><span class=\"ptag-dom\">Climate Risk</span><span class=\"ptag-dom\">Insurance</span></div></div>\n<div class=\"kw-row\"><span class=\"kw-label\">Method</span><div class=\"kw-tags\"><span class=\"ptag-met\">Spatial Analysis</span><span class=\"ptag-met\">Composite Index Design</span><span class=\"ptag-met\">AHP</span></div></div>\n</div>\n<div class=\"pcard-actions\">\n<span class=\"plink\">View Project →</span>\n<a aria-label=\"Open GitHub repositor
