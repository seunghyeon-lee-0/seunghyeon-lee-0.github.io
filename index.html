 class=\"kw-row\"><span class=\"kw-label\">Method</span><div class=\"kw-tags\"><span class=\"ptag-met\">Field Research</span><span class=\"ptag-met\">Community Growth</span><span class=\"ptag-met\">Crowdfunding</span></div></div>\n</div>\n<div class=\"plink\">View Project →</div>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ AWARDS ══ -->\n<section id=\"awards\">\n<div class=\"sec-label\">Awards &amp; Honors</div>\n<h2>Selected Awards</h2>\n<p class=\"sec-sub\">Selected awards across data analytics, risk management, and entrepreneurship.</p>\n<p class=\"click-hint\">\n<span aria-hidden=\"true\" class=\"click-hint-icon\">\n<svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\">\n<path d=\"M9 4.5a1.6 1.6 0 0 1 3.2 0v6\"></path>\n<path d=\"M12.2 10.6V9a1.6 1.6 0 0 1 3.2 0v1.9\"></path>\n<path d=\"M15.4 11.2v-.9a1.6 1.6 0 0 1 3.2 0v5.2a5.4 5.4 0 0 1-5.4 5.4h-1.4a5 5 0 0 1-3.9-1.9L5 15.4a1.6 1.6 0 0 1 2.5-2l1.5 1.8\"></path>\n</svg>\n</span>\n    Click an award to see the related project.\n  </p>\n<div class=\"award-grid\">\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Grand Prize</div>\n<div class=\"award-name\">2026 Spring Graduate &amp; Undergraduate Idea Competition</div>\n<div class=\"award-meta\"><span class=\"award-org\">Korea Digital Industry Information Society · Korea Smart Media Society</span><span class=\"award-date\">2026.04</span></div>\n<div class=\"award-detail\"><div><p>A decision-support system that explains manufacturing AI in operational terms and compares cost, lead time, and quality across response strategies.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('twincept')\" type=\"button\">Related Project → TwinCept: Explainable Factory AI</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Grand Prize</div>\n<div class=\"award-name award-name--hl\">2025 D-Testbed Program</div>\n<div class=\"award-meta\"><span class=\"award-org\">Korea Fintech Center</span><span class=\"award-date\">2025.12</span></div>\n<div class=\"award-detail\"><div><p>An explainable credit scoring model using financial and telecom behavior data with GNN and XAI to assess repayment potential for thin-file customers.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('pinfit')\" type=\"button\">Related Project → Graph-Based Credit Scoring</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Honorable Mention</div>\n<div class=\"award-name\">2025 Fall Graduate &amp; Undergraduate Idea Competition</div>\n<div class=\"award-meta\"><span class=\"award-org\">Korea Knowledge Management Society</span><span class=\"award-date\">2025.11</span></div>\n<div class=\"award-detail\"><div><p>Designed an AI agent combining customer clustering with ML–LLM hybrid recommendations for personalized financial products and habit coaching.</p></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Honorable Mention</div>\n<div class=\"award-name award-name--hl\">3rd National University Risk Management Competition</div>\n<div class=\"award-meta\"><span class=\"award-org\">Samsung Fire &amp; Marine Insurance × POSTECH × Seoul National University</span><span class=\"award-date\">2025.06</span></div>\n<div class=\"award-detail\"><div><p>A risk-modeling project that dynamically assessed flood vulnerability and response capacity across Seoul’s 25 districts to design risk-based pricing and compensation.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('flood')\" type=\"button\">Related Project → Flood Risk Modeling</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Grand Prize</div>\n<div class=\"award-name award-name--hl\">12th 2024 Big Contest – Data Analytics</div>\n<div class=\"award-meta\"><span class=\"award-org\">KAIT · AI Data Forum</span><span class=\"award-date\">2024.12</span></div>\n<div class=\"award-detail\"><div><p>A mobility analytics project optimizing festival shuttle stops, routes, and time-based schedules using foot-traffic and transportation data.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('shuttle')\" type=\"button\">Related Project → Shuttle Bus Location Optimization</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Honorable Mention</div>\n<div class=\"award-name\">2023 Healthcare Data Visualization Competition</div>\n<div class=\"award-meta\"><span class=\"award-org\">Yonsei University SW-Centered University Program</span><span class=\"award-date\">2023.10</span></div>\n<div class=\"award-detail\"><div><p>A Power BI dashboard integrating health screening, treatment, and prescription data to make personal health status and risk factors easier to explore.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('health')\" type=\"button\">Related Project → Healthcare Data Visualization</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Grand Prize</div>\n<div class=\"award-name\">2023 Gangwon Startup Audition – June</div>\n<div class=\"award-meta\"><span class=\"award-org\">Gangwon Center for Creative Economy &amp; Innovation</span><span class=\"award-date\">2023.06</span></div>\n<div class=\"award-detail\"><div><p>A platform concept designed to connect purchases with social-impact donations.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('moeun')\" type=\"button\">Related Project → Moeun – Social Commerce for Animal Welfare</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">Excellence Award</div>\n<div class=\"award-name award-name--hl\">Cambridge UK Global Entrepreneurship Camp</div>\n<div class=\"award-meta\"><span class=\"award-org\">University of Cambridge</span><span class=\"award-date\">2023.03</span></div>\n<div class=\"award-detail\"><div><p>A project that identified language barriers in overseas pharmacy use through UK interviews and pharmacy collaboration, then developed a multilingual medication guidance prototype.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('medi')\" type=\"button\">Related Project → Medi-Changer in the UK</button></div></div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ CONFERENCES & ACTIVITIES ══ -->\n<section id=\"conferences\">\n<div class=\"sec-label\">Conferences &amp; Activities</div>\n<h2>Conferences &amp; Activities</h2>\n<p class=\"sec-sub\">Conference presentations and activities that shaped my work as a researcher and builder.</p>\n<div class=\"block-label\">01. Academic Conference Presentations</div>\n<div class=\"conf-list\">\n<div class=\"conf-card fade\">\n<div class=\"conf-main\">\n<div class=\"ptag\">International Conference · 2026.07</div>\n<h3 class=\"conf-title\">Predicting Abandonment Depth in E-Commerce Purchase Journeys Using Page Transition Structure</h3>\n<p class=\"conf-desc\">Presented a study using clickstream page transitions to predict where customers abandon the purchase journey.</p>\n</div>\n<div class=\"conf-side\">\n<div class=\"conf-name\">ICBASS 2026</div>\n<div class=\"conf-place\">Fukuoka, Japan</div>\n<span class=\"ptech\">Oral Presentation</span>\n</div>\n</div>\n<div class=\"conf-card fade\">\n<div class=\"conf-main\">\n<div class=\"ptag\">International Conference · 2026.01</div>\n<h3 class=\"conf-title\">Text Mining-Based Analysis and Comparison of Generative, Agentic, and Physical AI</h3>\n<p class=\"conf-desc\">Compared perceptions across AI types using BERTopic-based topic modeling of news and online community discourse.</p>\n</div>\n<div class=\"conf-side\">\n<div class=\"conf-name\">ICBSS 2026</div>\n<div class=\"conf-place\">Tokyo, Japan</div>\n<span class=\"ptech\">Oral Presentation</span>\n</div>\n</div>\n</div>\n<div class=\"block-label\">02. Activities</div>\n<div class=\"card-grid\" style=\"margin-top:1.8rem\">\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"Cambridge Global Entrepreneurship Camp\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-cambridge.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">International Program · Cambridge, UK</div>\n<div class=\"pname\">Cambridge Global Entrepreneurship Camp</div>\n<div class=\"pdesc\">Joined entrepreneurship sessions and team projects in the UK, identified user problems through street interviews, and developed them into a business concept. I took the idea through prototyping, field validation, and a final IR pitch.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Customer Discovery</span><span class=\"ptech\">Prototyping</span><span class=\"ptech\">IR Pitch</span></div>\n</div>\n</div>\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"Moeun Project\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-moeun.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Social Venture Project</div>\n<div class=\"pname\">Moeun – Commerce for Animal Welfare</div>\n<div class=\"pdesc\">Planned and operated a commerce platform selling products that support animal shelters. From shelter partnerships and brand onboarding to crowdfunding and flea markets, I tested a model that connects consumption with social impact.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Partnership</span><span class=\"ptech\">Funding</span><span class=\"ptech\">Business Execution</span></div>\n</div>\n</div>\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"Enactus\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-enactus.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Social Entrepreneurship · Project Activity</div>\n<div class=\"pname\">Enactus : Business for Social Impact</div>\n<div class=\"pdesc\">Planned and executed projects that address social problems through business. I worked from problem definition to concept development and experienced how business can create sustainable social impact.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Project Planning</span><span class=\"ptech\">Problem Solving</span><span class=\"ptech\">Team Collaboration</span></div>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ CERTIFICATIONS ══ -->\n<section id=\"certifications\">\n<div class=\"sec-label\">Certifications</div>\n<h2>Credentials</h2>\n<div class=\"certs-grid\">\n<div class=\"cert-card fade\">\n<div class=\"cert-logo\"><img alt=\"Korea Data Agency\" onerror=\"this.parentElement.textContent='K-DATA'\" src=\"assets/images/logo-kdata.png\"/></div>\n<div>\n<div class=\"cert-title\">SQLD – SQL Developer</div>\n<div class=\"cert-meta\">Korea Data Agency (K-DATA)</div>\n</div>\n</div>\n<div class=\"cert-card fade\">\n<div class=\"cert-logo\"><img alt=\"Korea Data Agency\" onerror=\"this.parentElement.textContent='K-DATA'\" src=\"assets/images/logo-kdata.png\"/></div>\n<div>\n<div class=\"cert-title\">ADsP – Advanced Data Analytics Semi-Professional</div>\n<div class=\"cert-meta\">Korea Data Agency (K-DATA)</div>\n</div>\n</div>\n</div>\n</section>\n<footer>\n<div class=\"foot-inner\">\n<span class=\"foot-copy\">© 2026 Seunghyeon Lee</span>\n<div class=\"foot-links\">\n<button class=\"foot-link foot-mail\" data-d=\"yonsei.ac.kr\" data-u=\"dltmd004\" id=\"footMail\" type=\"button\">Email</button>\n<a class=\"foot-link\" href=\"https://github.com/seunghyeon-lee-0\" rel=\"noreferrer\" target=\"_blank\">GitHub</a>\n<a class=\"foot-link\" href=\"https://www.linkedin.com/in/seunghyeon-lee-a156aa310/\" rel=\"noreferrer\" target=\"_blank\">LinkedIn</a>\n<a class=\"foot-link\" href=\"https://velog.io/@idam0424/series\" rel=\"noreferrer\" target=\"_blank\">Blog</a>\n</div>\n<span class=\"build\">build v39</span>\n</div>\n</footer>\n<!-- ══ MODALS ══ -->\n<div id=\"modal-overlay\" onclick=\"closeModal()\"></div>\n<!-- Working Paper 1 -->\n<div class=\"modal\" id=\"modal-paper-churn\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Research 01 · In Progress</div>\n<div class=\"modal-head-title\">Customer Behavior &amp; Churn Analysis</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-img-slot\" style=\"margin-top:0\"><img alt=\"E-commerce Customer Behavior\" onerror=\"this.parentElement.remove()\" src=\"assets/images/thumb-churn.jpg\"/></div>\n<div class=\"ptechs\" style=\"margin:1.1rem 0 0\"><span class=\"ptech\">Customer Behavior</span><span class=\"ptech\">Clickstream</span><span class=\"ptech\">Retention</span><span class=\"ptech\">Customer Segmentation</span><span class=\"ptech\">Churn Prediction</span><span class=\"ptech\">Python</span></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Using clickstream and purchase data, I examined how customer behavior relates to <strong>conversion, repeat visits, and churn</strong>.</p>\n<p class=\"modal-text\">The analysis spans the customer lifecycle, from early-session behavior to long-term loyal-user patterns.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research Focus</div>\n<p class=\"modal-text\">The research focused on three questions.</p>\n<div class=\"modal-sub\">01. Which early behaviors influence new-customer retention?</div>\n<p class=\"modal-text\">I examined which early-session behaviors are associated with repeat visits and longer-term retention.</p>\n<div class=\"modal-sub\">02. How do loyal customers behave differently from other customers?</div>\n<p class=\"modal-text\">I segmented customers by purchase and usage patterns to identify what distinguishes long-term users.</p>\n<div class=\"modal-sub\">03. Can behavioral data predict purchase and churn in advance?</div>\n<p class=\"modal-text\">I tested whether clickstream and purchase history could be used to predict future purchase and churn behavior.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Methodology</div>\n<p class=\"modal-text\">I combined clickstream and purchase data, engineered behavioral features, compared customer segments, and used machine learning to predict purchase and churn likelihood.</p>\n<div class=\"modal-hypothesis\">※ Some methodological details are withheld while the manuscripts are in preparation.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Findings</div>\n<p class=\"modal-text\">The findings suggest that <strong>pre-purchase behavior</strong> reveals signals that are not visible from purchase outcomes alone.</p>\n<p class=\"modal-text\">These signals can support customer segmentation, early retention strategies, and proactive churn intervention.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Status</div>\n<p class=\"modal-text\"><strong>Analysis completed</strong> | Manuscript in preparation</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/customer-behavior-churn-analysis.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Working Paper 2 -->\n<div class=\"modal\" id=\"modal-paper-ai\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Research 02 · In Progress</div>\n<div class=\"modal-head-title\">AI Perception Analysis</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-img-slot\" style=\"margin-top:0\"><img alt=\"AI Perception Analysis\" onerror=\"this.parentElement.remove()\" src=\"assets/images/thumb-ai.jpg\"/></div>\n<div class=\"ptechs\" style=\"margin:1.1rem 0 0\"><span class=\"ptech\">Text Mining</span><span class=\"ptech\">AI Perception</span><span class=\"ptech\">Generative AI</span><span class=\"ptech\">Agentic AI</span><span class=\"ptech\">Physical AI</span></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">This study compares news and online community discourse around Generative, Agentic, and Physical AI to understand <strong>how perceived value and risk differ by AI type</strong>.</p>\n<p class=\"modal-text\">Rather than focusing only on technical capability, the study looks at how emerging AI technologies are understood and discussed by the public and by users.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research Focus</div>\n<div class=\"modal-sub\">01. How do key values and concerns differ across AI types?</div>\n<p class=\"modal-text\">I compared the dominant themes surrounding Generative, Agentic, and Physical AI.</p>\n<div class=\"modal-sub\">02. Do news media and user communities frame AI differently?</div>\n<p class=\"modal-text\">I compared macro-level narratives in news with user-level experiences in online communities.</p>\n<div class=\"modal-sub\">03. Can perceptions of different AI technologies be compared within a common framework?</div>\n<p class=\"modal-text\">I developed a common analytical frame for comparing values and concerns across AI types.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Methodology</div>\n<p class=\"modal-text\">I collected and preprocessed news and community data, extracted topics with <strong>BERTopic</strong>, and mapped large-scale discourse using SentenceTransformers, UMAP, and HDBSCAN.</p>\n<p class=\"modal-text\">I then compared key values and issues by AI type and data source.</p>\n<div class=\"modal-hypothesis\">※ Some methodological details are withheld while the manuscripts are in preparation.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Findings</div>\n<p class=\"modal-text\">Although all three fall under the broader AI category, <strong>the values and concerns emphasized by users differ by AI type</strong>.</p>\n<p class=\"modal-text\">The analysis also revealed a gap between media narratives and user discussions, highlighting the value of examining both perspectives.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Status</div>\n<p class=\"modal-text\"><strong>Analysis completed</strong> | Manuscript in preparation</p>\n<p class=\"modal-text\">Presented at ICBSS 2026 in Tokyo, Japan, in January 2026.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/ai-perception-analysis.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- TwinCept -->\n<div class=\"modal\" id=\"modal-twincept\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Smart Manufacturing · Explainable AI</div>\n<div class=\"modal-head-title\">TwinCept: Explainable Factory AI</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2026 Spring Graduate &amp; Undergraduate Idea Competition Grand Prize · Korea Digital Industry Information Society × Korea Smart Media Society</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Service Planning · Data Structure Design · Prototype Design</div>\n<ul>\n<li>Identified key barriers to using AI in manufacturing decisions and defined the service’s core features.</li>\n<li>Mapped manufacturing data to decision criteria that managers can interpret and act on.</li>\n<li>Designed a dashboard prototype for scenario comparison and manager-in-the-loop decision making.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">In smart factories, AI can recommend schedules and operating plans, but <strong>black-box reasoning and limited alternatives make those recommendations hard to trust and use.</strong></p>\n<p class=\"modal-text\">TwinCept translates complex manufacturing data into operational concepts such as equipment health, quality risk, and delivery margin. It then compares multiple response scenarios so managers can choose based on trade-offs rather than a single black-box recommendation.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Manufacturing Data Mapping</div>\n<p class=\"modal-text\">Analyzed production, quality, equipment, inventory, and logistics data structures provided by a manufacturing company.</p>\n<p class=\"modal-text\">Mapped data such as vibration, output, downtime, and defects to five decision criteria: <strong>equipment health, quality risk, supply stability, line efficiency, and delivery margin</strong>.</p>\n<p class=\"modal-text\">This turns raw sensor and process data into operational information that managers can interpret quickly.</p>\n<div class=\"modal-img-slot\"><img alt=\"AI Prediction · Manager Intervention · Updated Prediction\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-01-mapping.jpg\"/></div>\n<div class=\"modal-img-caption\">AI Prediction → Manager Intervention → Updated Prediction - Predictions update when managers adjust decision criteria.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Scenario-Based Decision Design</div>\n<p class=\"modal-text\">Instead of presenting one “optimal” answer, the system compares <strong>multiple response scenarios built around different operational priorities</strong>.</p>\n<p class=\"modal-text\">Proposed a DES- and DRL-based scenario engine that compares delivery feasibility, cost, quality, and equipment risk across options.</p>\n<div class=\"modal-img-slot\"><img alt=\"Single optimum vs. multiple scenarios\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-02-scenario.jpg\"/></div>\n<div class=\"modal-img-caption\">Single black-box optimum → multiple scenarios + KPI-based transparent decisions</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Interactive Dashboard</div>\n<p class=\"modal-text\">Built a dashboard prototype that brings decision criteria, scenario comparison, and manager intervention into one view.</p>\n<p class=\"modal-text\">Managers can compare outcomes, adjust decision criteria, and immediately see how those changes affect the recommendation.</p>\n<div class=\"modal-img-slot\"><img alt=\"Digital Twin DSS Dashboard\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-03-dashboard.jpg\"/></div>\n<div class=\"modal-img-caption\">Digital Twin DSS – CBM indicators, scenario comparison, and manager intervention in one dashboard</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">TwinCept reframes manufacturing AI outputs as <strong>clear decision criteria and comparable options</strong>.</p>\n<p class=\"modal-text\">This makes it easier to compare trade-offs across delivery, cost, quality, and equipment risk while keeping human judgment in the loop.</p>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- PinFit -->\n<div class=\"modal\" id=\"modal-pinfit\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Credit Risk Modeling · Graph Learning</div>\n<div class=\"modal-head-title\">Graph-Based Credit Scoring</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink\" href=\"https://www.fsc.go.kr/no010101/85933\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>Financial Services Commission ↗</a>\n<a class=\"mlink\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=824393\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>NewsWorks Coverage ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2025 D-Testbed Program Grand Prize · Korea Fintech Center</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Credit Risk Analysis · Graph Modeling</div>\n<ul>\n<li>Benchmarked a GAT model against traditional credit scoring models.</li>\n<li>Used attention scores to identify the variables and interactions driving predictions.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Traditional credit scoring relies heavily on prior financial history. As a result, <strong>thin-file customers may be underestimated even when they have strong repayment capacity.</strong></p>\n<p class=\"modal-text\">This project combines financial and telecom data in a <strong>Graph Attention Network (GAT)</strong> model that learns relationships among variables rather than treating them independently.</p>\n<p class=\"modal-text\">I benchmarked the model against traditional ML baselines and used attention scores to make its predictions more interpretable.</p>\n<div class=\"modal-img-slot\"><img alt=\"Final pipeline\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-04-pipeline.jpg\"/></div>\n<div class=\"modal-img-caption\">Final pipeline</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Data Processing</div>\n<p class=\"modal-text\">Built the analysis dataset by combining financial variables such as card use, loans, delinquency, assets, and income with telecom membership data.</p>\n<div class=\"modal-img-slot\"><img alt=\"Dataset structure\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-01-dataset.jpg\"/></div>\n<div class=\"modal-img-caption\">Shinhan Card consortium dataset combining financial usage and telecom membership data</div>\n<p class=\"modal-text\">Cleaned missing values and outliers, transformed skewed variables, and addressed severe class imbalance—only <strong>2.2%</strong> delinquent cases—using 10-fold cross-validation and SMOTE.</p>\n<p class=\"modal-text\">Filtered weak predictors with statistical tests and Information Value, then applied WoE-based fine and coarse classing to improve stability and interpretability.</p>\n<div class=\"modal-img-slot\"><img alt=\"Data Processing &amp; Feature Engineering\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-02-processing.jpg\"/></div>\n<div class=\"modal-img-caption\">Data Processing &amp; Feature Engineering</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Baseline Modeling</div>\n<p class=\"modal-text\">Built <strong>Logistic Regression, Random Forest, and XGBoost</strong> as baseline models for comparison.</p>\n<div class=\"modal-img-slot\"><img alt=\"Selected model comparison\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-06-models.jpg\"/></div>\n<div class=\"modal-img-caption\">Selected models – characteristics and selection rationale</div>\n<div class=\"modal-img-slot\"><img alt=\"Baseline Model Performance\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-03-baseline.jpg\"/></div>\n<div class=\"modal-img-caption\">Baseline Model Performance - XGBoost &gt; Random Forest &gt; Logistic Regression</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Graph-Based Credit Modeling</div>\n<p class=\"modal-text\">Designed a GAT-based model to capture relationships among variables, especially where traditional financial-history signals are limited.</p>\n<p class=\"modal-text\">Represented variables as <strong>nodes</strong> and feature interactions as <strong>edges</strong>. GAT learns which relationships matter most through attention weights.</p>\n<p class=\"modal-text\">This allows the model to capture interactions across financial and non-financial features that conventional tabular models may miss.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 04 - Explainable Credit Assessment</div>\n<p class=\"modal-text\">Added an explainability layer so reviewers can see <strong>what drove each prediction</strong>, not just the score.</p>\n<p class=\"modal-text\">Used GAT attention scores to identify influential variables and interactions, then visualized those relationships as an attention graph.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 01 - Model Performance</div>\n<p class=\"modal-text\">GAT outperformed XGBoost, the strongest baseline, across every major evaluation metric.</p>\n<table class=\"modal-table\">\n<tr><th>Model</th><th>Accuracy</th><th>Recall</th><th>F1-score</th><th>AUROC</th><th>KS</th></tr>\n<tr><td>XGBoost</td><td>0.87</td><td>0.70</td><td>0.77</td><td>0.87</td><td>0.59</td></tr>\n<tr class=\"row-hl\"><td>GAT</td><td>0.91</td><td>0.82</td><td>0.86</td><td>0.92</td><td>0.71</td></tr>\n</table>\n<p class=\"modal-text\" style=\"margin-top:1.4rem\">Most notably, recall improved from <strong>0.70 to 0.82</strong>, helping identify risky thin-file customers that the baseline model missed.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 02 - Explainable Risk Assessment</div>\n<p class=\"modal-text\">Built an attention graph to show which variables and interactions contribute most to credit-risk predictions.</p>\n<p class=\"modal-text\">By pairing scores with their drivers, the model can better support <strong>credit review, model validation, and risk management</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Self-Attention Map and Attention Graph\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-05-results.jpg\"/></div>\n<div class=\"modal-img-caption\">Self-Attention Map · Attention Graph - Visualized the variables and relationships that contributed most to predictions</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">The project shows how <strong>relationships across financial and non-financial data</strong> can help assess repayment potential without equating limited history with poor creditworthiness.</p>\n<ul class=\"modal-list\">\n<li>Identify potentially creditworthy customers missed by existing models</li>\n<li>Expand the addressable customer base for financial institutions</li>\n<li>Improve high-risk customer detection</li>\n<li>Support credit review and internal risk management</li>\n<li>Strengthen regulatory readiness through model explainability</li>\n</ul>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Moeun -->\n<div class=\"modal\" id=\"modal-moeun\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Field Research · Social Commerce · Funding &amp; Offline Sales</div>\n<div class=\"modal-head-title\">Moeun – Social Commerce for Animal Welfare</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Field Research · Social Media · Funding &amp; Flea Market</div>\n<ul>\n<li>Visited animal shelters and volunteered on site to understand their operational and outreach challenges firsthand.</li>\n<li>Tested customer interest through Instagram content and offline flea-market sales.</li>\n<li>Ran a crowdfunding campaign for shelter-collaboration products to test whether purchases could directly support social impact.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Moeun is a social commerce project that brings shelter-support products into one place while <strong>making donations and shelter updates more visible</strong>.</p>\n<p class=\"modal-text\">The project tackled two problems at once: shelters’ funding and outreach challenges, and donors’ lack of visibility into where support goes. We tested the model through field research, social media, flea markets, and crowdfunding.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Finding the Real Problem</div>\n<p class=\"modal-text\">I visited shelters, volunteered on site, and observed the day-to-day challenges faced by staff.</p>\n<p class=\"modal-text\">Across <strong>209 public shelters</strong>, the research found that challenges went beyond funding to include <strong>ongoing promotion of adoption, foster care, and fundraising products</strong>.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"Shelter volunteering\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-01-volunteer.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"Shelter field visit\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-02-shelter.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 01 · Shelter Field Research</strong> - Visited shelters to validate the problem and refine the project direction.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">From Awareness to Action</div>\n<p class=\"modal-text\">Used Instagram to build awareness and flea markets to test whether that interest could convert into purchases.</p>\n<p class=\"modal-text\">The campaign grew social media followers by about <strong>300%</strong>, while flea-market sales reached <strong>160%</strong> of the target.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"Flea market booth\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-03-flea1.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"Flea market event\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-04-flea2.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 02 · Market Validation</strong> - Tested whether social value could translate into real interest and purchases through online content and offline sales.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Running the Funding Campaign</div>\n<p class=\"modal-text\">Designed characters and products inspired by dogs from partner shelters and launched a crowdfunding campaign to test whether <strong>product purchases could directly fund shelter support</strong>.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"Crowdfunding page\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-05-funding.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"Collaboration products\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-06-goods.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 03 · Crowdfunding</strong> - Designed and crowdfunded shelter-collaboration products to validate the social commerce model.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Validation</div>\n<div class=\"modal-stats-row\">\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">209</div><div class=\"modal-stat-label\">Shelters surveyed</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">160%</div><div class=\"modal-stat-label\">Sales vs. target at flea market</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">300%</div><div class=\"modal-stat-label\">Social media follower growth</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">MOU</div><div class=\"modal-stat-label\">Animal shelter partnership</div></div>\n</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Takeaways</div>\n<p class=\"modal-text\">The biggest lesson was that social impact needs more than a good idea—it needs <strong>clear ways for people to participate and a model that can sustain itself</strong>.</p>\n<p class=\"modal-text\">From field research to social media, offline sales, and crowdfunding, I learned how to turn a social-impact idea into something that could be tested through real customer behavior.</p>\n<div class=\"sdg-block\">\n<img alt=\"SDGs 3 · 11 · 15\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-07-sdgs.png\"/>\n</div>\n<div class=\"partner-block\">\n<div class=\"partner-label\">Partner Organizations</div>\n<div class=\"partner-logos partner-logos--wide\">\n<img alt=\"Kkotgil Geotgae · OPENKNOWL · Gangwon Regional Innovation Platform · Gangwon Center for Creative Economy &amp; Innovation\" onerror=\"this.remove()\" src=\"assets/images/partner-moeun.png\"/>\n</div>\n</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Medi-Changer -->\n<div class=\"modal\" id=\"modal-medi\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Field Research · Pharmacy Collaboration · Service Prototyping</div>\n<div class=\"modal-head-title\">Medi-Changer in the UK</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 Cambridge UK Global Entrepreneurship Camp Excellence Award · University of Cambridge</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Data Research · Market Research · Field Validation</div>\n<ul>\n<li>Conducted street interviews and market research with users in the UK.</li>\n<li>Synthesized feedback from both users and pharmacy professionals.</li>\n<li>Translated field findings into a clear problem definition, core features, and a service prototype.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Medi-Changer is a <strong>multilingual medication guidance service</strong> for travelers navigating language barriers and unfamiliar medication information abroad.</p>\n<p class=\"modal-text\">During a UK entrepreneurship program, I interviewed local users, validated the problem with pharmacists in Korea, and developed the idea into a service prototype.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Finding the Real Problem</div>\n<p class=\"modal-text\">I conducted street interviews in the UK to understand how travelers handle illness, search for medication information, and navigate pharmacies abroad.</p>\n<p class=\"modal-text\">The interviews showed that the challenge went beyond translation: users struggled to <strong>describe symptoms clearly and compare unfamiliar local medicines with products they already knew</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Street Interviews in the UK\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-01-interview.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 01 · Street Interviews in the UK</strong> - Interviewed users in the UK about overseas pharmacy experiences, medication search behavior, and willingness to use the service.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Field Validation with Pharmacies</div>\n<p class=\"modal-text\">To validate the problem from the practitioner side, I worked with pharmacies to observe <strong>how foreign customers are served and how medication guidance is delivered</strong>.</p>\n<p class=\"modal-text\">Tested symptom-expression materials and medication guidance at Heungeop Onnuri Pharmacy and Myeongdong Pharmacy, refining symptom categories and wording based on <strong>pharmacist feedback</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Pharmacy Collaboration\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-02-pharmacy.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 02 · Pharmacy Collaboration</strong> - Observed symptom communication and medication guidance in real pharmacy settings and reflected both user and pharmacist needs in the service design.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Building the Prototype</div>\n<p class=\"modal-text\">Based on the field research, I designed a prototype that helps users communicate symptoms visually and compare local OTC medicines with familiar alternatives.</p>\n<ul class=\"modal-list\">\n<li>Visual symptom board for selecting body areas and symptoms</li>\n<li>OTC drug scanning and ingredient information</li>\n<li>Comparable medication information by country</li>\n<li>Multilingual medication guidance for users and pharmacists</li>\n</ul>\n<div class=\"modal-img-slot\"><img alt=\"Service Prototype\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-03-prototype.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 03 · Service Prototype</strong> - Translated insights from street interviews and pharmacy collaboration into user flows and core product features.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research at a Glance</div>\n<p class=\"modal-text\">Conducted field research in Korea and the UK to validate the service concept.</p>\n<div class=\"modal-img-slot\"><img alt=\"Research at a Glance\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-04-research.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Takeaways</div>\n<p class=\"modal-text\">The biggest takeaway was that desk research was not enough. <strong>Meeting users and observing pharmacy workflows changed our initial assumptions</strong> and led to features grounded in real usage contexts.</p>\n<div class=\"partner-block\">\n<div class=\"partner-label\">Partner Organizations</div>\n<div class=\"partner-logos partner-logos--wide\">\n<img alt=\"National Health Insurance Service · Health Insurance Review &amp; Assessment Service · Gangwon Province\" onerror=\"this.remove()\" src=\"assets/images/partner-medi.png\"/>\n</div>\n</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Flood -->\n<div class=\"modal\" id=\"modal-flood\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Climate Risk · Spatial Analysis · Insurance Design</div>\n<div class=\"modal-head-title\">Flood Risk Modeling</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink mlink--gh\" href=\"https://github.com/seunghyeon-lee-0/flood-risk-insurance-model\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"currentColor\" viewbox=\"0 0 24 24\"><path d=\"M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.1 5.1 18 5.4 18 5.4c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3\"></path></svg>GitHub Repository ↗</a>\n<a class=\"mlink\" href=\"https://www.newsdream.kr/news/articleView.html?idxno=86727\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>Press Coverage ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 Samsung Fire &amp; Marine Insurance × POSTECH × Seoul National University 3rd National University Risk Management Competition Honorable Mention · 2025</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Spatial Data Analysis · Risk Modeling</div>\n<ul>\n<li>Processed Landsat and spatial data in ArcGIS and visualized flood-related indicators by district.</li>\n<li>Calculated variable importance and weighting factors in Python.</li>\n<li>Combined the processed data and weighting results to generate final flood-risk scores for Seoul’s 25 districts.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">The project started from a gap in conventional risk assessment: as climate change brings extreme rainfall to previously low-risk areas, <strong>static flood-risk scores no longer fully reflect how risk changes in practice</strong>.</p>\n<p class=\"modal-text\">Using Seoul as the case area, I compared normal and extreme-rainfall conditions and built a framework that combines vulnerability with local response capacity.</p>\n<div class=\"modal-sub modal-sub--gap\">EDA</div>\n<div class=\"modal-img-trio\">\n<div class=\"modal-img-slot\"><img alt=\"District-level defense capacity and damage, 2020 &amp; 2022\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-1.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"District-level defense capacity and damage, 2022\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-2.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"District-level defense capacity and damage, 2020\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-3.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\">Damage vs. defense capacity by district – major losses were observed even in districts with strong infrastructure.</div>\n<div class=\"modal-img-slot\"><img alt=\"From flood risk to insurance design\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-02-pipeline.jpg\"/></div>\n<div class=\"modal-img-caption\">Full pipeline: public &amp; satellite data → FVI/FDI → 2020 vs. 2022 comparison → risk classification → insurance design</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Data &amp; Preprocessing</div>\n<div class=\"modal-sub\">Data Sources</div>\n<ul class=\"modal-list\">\n<li><strong>Landsat 8 Satellite Data</strong> - Satellite imagery used to measure vegetation, urbanization, and land-surface temperature across Seoul</li>\n<li><strong>KMA Monsoon &amp; Rainfall Data</strong> - Climate data used to distinguish normal and extreme rainfall conditions from 1961–2024</li>\n<li><strong>District Flood-Defense Capacity Data</strong> - Local flood-defense infrastructure and response capacity, including levees, retention basins, and pumping stations</li>\n<li><strong>Flood Damage Data</strong> - Observed flood damage based on losses, flooded households, and affected population by district</li>\n</ul>\n<div class=\"modal-sub modal-sub--gap\">Preprocessing</div>\n<p class=\"modal-text\">Converted Landsat 8 DN values to radiance and brightness temperature, then derived spatial indicators including <strong>NDVI, NDBI, and LST</strong>.</p>\n<p class=\"modal-text\">Integrated the data at district level and applied interpolation, area-based standardization, and normalization to create a comparable risk dataset.</p>\n<div class=\"modal-img-slot\"><img alt=\"NDVI · NDBI · LST Visualization\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-09-indices.jpg\"/></div>\n<div class=\"modal-img-caption\">NDVI(Normalized Difference Vegetation Index) · NDBI(Normalized Difference Built-up Index) · LST(Land Surface Temperature) Visualization Results</div>\n<div class=\"modal-img-slot\"><img alt=\"Radiance · BT · NDVI · Pv · NDBI Formulas\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-10-formula1.jpg\"/></div>\n<div class=\"modal-img-slot modal-img-slot--xs\"><img alt=\"LST Formula\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-11-formula2.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Risk Index Design</div>\n<p class=\"modal-text\">Using public and satellite data, I analyzed variables related to observed flood damage and reframed local risk along two dimensions: <strong>vulnerability</strong> and <strong>response capacity</strong>.</p>\n<div class=\"modal-sub\">FVI - Flood Vulnerability Index</div>\n<p class=\"modal-text\">Measures flood vulnerability using observed damage, population and household density, impervious surface ratio, and other exposure-related variables.</p>\n<div class=\"modal-sub\">FDI - Flood Defense Infrastructure Index</div>\n<p class=\"modal-text\">Measures local response capacity using flood-defense facilities, sewer networks, fiscal capacity, firefighting resources, and related factors.</p>\n<div class=\"modal-hypothesis\">Variable weights were derived through expert-based AHP analysis.</div>\n<div class=\"modal-img-slot\"><img alt=\"FVI and FDI indicators\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-03-indicators.jpg\"/></div>\n<div class=\"modal-img-caption\">FVI/FDI structure, variable formulas, and GIS indicator maps</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Dynamic Risk Classification</div>\n<p class=\"modal-text\">The baseline PCD Matrix classifies areas using defense capacity and observed damage. Comparing 2020 and 2022 revealed that <strong>some districts’ risk labels did not match their actual flood outcomes</strong>.</p>\n<p class=\"modal-text\">This led to a <strong>dynamic risk framework</strong> that captures how district risk shifts between normal and extreme-rainfall conditions.</p>\n<div class=\"modal-img-slot\"><img alt=\"Baseline PCD Matrix 2020 vs 2022\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-04-pcd.jpg\"/></div>\n<div class=\"modal-img-caption\">PCD Matrix - 🔴 Dangerous · 🟠 Mess · 🟢 Safe · 🔵 Well-Protected (2020 vs 2022)</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 01 - Flood Risk Classification</div>\n<p class=\"modal-text\">Classified districts into four types based on how risk changes under normal and extreme rainfall.</p>\n<table class=\"modal-table\">\n<tr><th>Risk Type</th><th>Compensation Structure</th></tr>\n<tr><td>Stable</td><td>Linear indemnity based on actual loss</td></tr>\n<tr><td>Latent-Risk</td><td>Stepwise payout using multiple rainfall triggers</td></tr>\n<tr><td>Chronic-Risk</td><td>Combined stepwise and proportional-cap structure</td></tr>\n<tr><td>Misclassified</td><td>Initial advance payment followed by loss-based adjustment</td></tr>\n</table>\n<p class=\"modal-text\" style=\"margin-top:1.1rem\">This surfaced <strong>Latent-Risk areas</strong> that would be difficult to identify using a static ranking alone.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 02 - Risk-Based Pricing</div>\n<p class=\"modal-text\">Converted final FVI scores into district-level <strong>Risk Coefficients</strong> for insurance pricing, ranging from 1.00 to 1.96 based on relative risk rank.</p>\n<div class=\"modal-formula\">risk_coefficient = 1.00 + 0.04 × (25 − rank)</div>\n<table class=\"modal-table\">\n<tr><th>Rank</th><th>District</th><th>FVI 2020</th><th>FVI 2022</th><th>Final FVI</th><th>Risk Coefficient</th></tr>\n<tr><td>1</td><td>Gangdong-gu</td><td>0.150649</td><td>0.028418</td><td>0.113980</td><td>1.96</td></tr>\n<tr><td>2</td><td>Yeongdeungpo-gu</td><td>0.049914</td><td>0.104732</td><td>0.066359</td><td>1.92</td></tr>\n<tr><td>3</td><td>Dongjak-gu</td><td>0.037009</td><td>0.111389</td><td>0.059323</td><td>1.88</td></tr>\n<tr><td>4</td><td>Seongbuk-gu</td><td>0.069060</td><td>0.028030</td><td>0.056751</td><td>1.84</td></tr>\n<tr><td>5</td><td>Gwanak-gu</td><td>0.034631</td><td>0.091641</td><td>0.051734</td><td>1.80</td></tr>\n</table>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 03 - Insurance &amp; Compensation Design</div>\n<p class=\"modal-text\">Designed compensation structures by risk type rather than applying the same payout logic across all districts.</p>\n<div class=\"modal-sub\">Residential Flood Insurance</div>\n<table class=\"modal-table\">\n<tr><th>Type</th><th>Building</th><th>Contents</th><th>Deductible</th><th>Target</th></tr>\n<tr><td>Basic</td><td>KRW 200M</td><td>KRW 50M</td><td>KRW 1M</td><td>Detached and older urban housing</td></tr>\n<tr><td>Premium</td><td>KRW 300M</td><td>KRW 100M</td><td>KRW 0.5M</td><td>High-value homes or lower-risk districts</td></tr>\n<tr><td>Affordable</td><td>KRW 150M</td><td>KRW 30M</td><td>KRW 2M</td><td>Flood-prone areas and price-sensitive households</td></tr>\n</table>\n<div class=\"modal-sub\">Commercial and Industrial Flood Insurance</div>\n<table class=\"modal-table\">\n<tr><th>Type</th><th>Target</th><th>Building</th><th>Contents</th><th>Deductible</th></tr>\n<tr><td>A</td><td>Small shops and retail stores</td><td>KRW 500M</td><td>KRW 200M</td><td>KRW 1M</td></tr>\n<tr><td>B</td><td>Manufacturing businesses</td><td>KRW 1B</td><td>KRW 500M</td><td>KRW 5M</td></tr>\n<tr><td>C</td><td>Wholesale and logistics facilities</td><td>KRW 700M</td><td>KRW 500M</td><td>KRW 3M</td></tr>\n<tr><td>D</td><td>Basement shops and traditional markets</td><td>KRW 500M</td><td>KRW 200M</td><td>KRW 1M</td></tr>\n</table>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">Rather than treating flood risk as one static ranking, the project examined <strong>how local risk changes under extreme conditions</strong> and translated that analysis into pricing and compensation design.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/flood-risk-modeling.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Shuttle -->\n<div class=\"modal\" id=\"modal-shuttle\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Mobility Planning · Location Optimization · Route Design</div>\n<div class=\"modal-head-title\">Shuttle Bus Location Optimization</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink mlink--gh\" href=\"https://github.com/seunghyeon-lee-0/shuttle-stop-location-analysis\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"currentColor\" viewbox=\"0 0 24 24\"><path d=\"M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.1 5.1 18 5.4 18 5.4c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3\"></path></svg>GitHub Repository ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 12th 2024 Big Contest – Data Analytics Grand Prize · 2024</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Data Analysis · Location Optimization</div>\n<ul>\n<li>Collected and prepared the datasets required for location analysis.</li>\n<li>Used Python to calculate importance scores and weights for location variables.</li>\n<li>Applied MCLP and P-Median to optimize candidate stop locations.</li>\n<li>Translated the findings into operational recommendations, while documenting model limitations and next-step improvements.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Local festivals often create <strong>heavy congestion and parking pressure</strong>. This project used mobility and traffic data to design a shuttle system from stop selection and route planning through to operating strategy.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"Festival traffic EDA\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-01-eda.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"Local vs. non-local visitors\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-02-visitors.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\">EDA based on collected data – sharp increases in foot traffic and road traffic during the festival</div>\n<p class=\"modal-text\">The goal was to improve visitor access and operating efficiency while supporting <strong>a better festival experience and local activity</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Analysis Process Overview\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-03-process.jpg\"/></div>\n<div class=\"modal-img-caption\">Analysis Process Overview – data collection → EDA → AHP weighting → MCLP/P-Median/Greedy optimization → cluster-based route design</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Demand Analysis</div>\n<div class=\"modal-sub\">Data Sources</div>\n<p class=\"modal-text\">Collected and analyzed data related to visitor demand and stop accessibility.</p>\n<ul class=\"modal-list\">\n<li><strong>Foot-Traffic Data</strong> - Telecom-based hourly and spatial foot-traffic concentration during the festival</li>\n<li><strong>Traffic Volume Data</strong> - Road-segment traffic volume and vehicle mix</li>\n<li><strong>Public Transit Data</strong> - Existing stop locations and route coverage</li>\n<li><strong>Tourism &amp; Commercial Data</strong> - Foot traffic around key destinations and the distribution of lodging and commercial facilities</li>\n<li><strong>Spatial Data</strong> - Administrative boundaries, road networks, and festival venue locations</li>\n</ul>\n<div class=\"modal-sub modal-sub--gap\">Preprocessing</div>\n<p class=\"modal-text\">Removed speed outliers, identified destination visits, and created derived variables such as weekday/weekend and time-of-day features.</p>\n<div class=\"modal-img-slot\"><img alt=\"Preprocessing Process\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-04-preprocess.jpg\"/></div>\n<div class=\"modal-img-caption\">Feature generation and cleaning – speed outlier removal, destination identification, derived variables, and coordinate-system alignment</div>\n<p class=\"modal-text\">Then used AHP with <strong>16 expert respondents</strong> to weight location factors and quantify local demand.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Location Optimization</div>\n<p class=\"modal-text\">Applied two location-optimization models to balance demand coverage and walking accessibility with a limited number of stops.</p>\n<div class=\"modal-hypothesis\">MCLP emphasizes <strong>coverage and service efficiency</strong>, while P-Median emphasizes <strong>travel distance and accessibility</strong>.</div>\n<div class=\"modal-sub\">📍 MCLP - Maximal Covering Location Problem</div>\n<p class=\"modal-text\">Searched for stop combinations that cover the most weighted demand within a 400m service radius.</p>\n<div class=\"modal-img-slot\"><img alt=\"MCLP Formula and Weights\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-06-mclp.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"Additional MCLP Constraints\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-12-mclp-constraint.jpg\"/></div>\n<div class=\"modal-img-caption\">Added a minimum of two stops per local area to maintain 400m coverage.</div>\n<div class=\"modal-sub\">📍 P-Median</div>\n<p class=\"modal-text\">Assigned each demand point to a selected stop and minimized total demand-weighted travel distance.</p>\n<div class=\"modal-img-slot\"><img alt=\"P-Median Formula\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-07-pmedian.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"P-Median Multi-Objective Optimization and Weighted-Sum Approach\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-13-pmedian-issue.jpg\"/></div>\n<div class=\"modal-img-caption\">Combined distance minimization and weight maximization in a weighted objective function (λ=0.5).</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Final Bus Stop Selection</div>\n<p class=\"modal-text\">Combined the MCLP and P-Median outputs into about 43 candidate stops, then applied a <strong>Greedy Algorithm</strong> to rank and refine them.</p>\n<p class=\"modal-text\">After removing spatially redundant candidates with a 400m spacing rule, the final network included <strong>22 shuttle stops</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Greedy Algorithm Results\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-08-greedy.jpg\"/></div>\n<div class=\"modal-img-caption\">Selected 22 final stops after removing spatially overlapping candidates</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 04 - Route Planning</div>\n<p class=\"modal-text\">Compared K-Means and Hierarchical Clustering across the 22 selected stops and chose <strong>K=2</strong> based on silhouette score.</p>\n<div class=\"modal-img-slot\"><img alt=\"Cluster Selection Based on Silhouette Score\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-10-cluster.jpg\"/></div>\n<div class=\"modal-img-caption\">Selected K=2 based on the highest silhouette score, resulting in two shuttle routes</div>\n<p class=\"modal-text\">The 22 stops were split into two 11-stop service zones, which formed the basis for two shuttle routes.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 05 - Demand &amp; Frequency Planning</div>\n<p class=\"modal-text\">After selecting stops and routes, I added <strong>ML-based demand forecasting</strong> to inform service frequency. The best-performing <strong>XGBoost</strong> model was used to identify peak demand periods and guide scheduling.</p>\n<div class=\"modal-img-slot modal-img-slot--xs\"><img alt=\"Hourly demand forecast\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-11-demand.jpg\"/></div>\n<div class=\"modal-img-caption\">Hourly OD totals – identified peak-demand periods and reflected them in service frequency</div>\n<p class=\"modal-text\">This extended the analysis from network design into <strong>practical operating decisions</strong>.</p>\n<div class=\"modal-img-slot\"><img alt=\"Final routes and schedule\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-09-routes.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">The final recommendation connected location modeling to <strong>an implementable festival transportation plan</strong>, balancing coverage, accessibility, spatial redundancy, and operational feasibility.</p>\n<p class=\"modal-text\">Also reviewed model limitations and proposed future improvements using real-time traffic and visitor mobility data.</p>\n<div class=\"modal-hypothesis\">The results were shared with the local government and received a positive review, with <strong>implementation under discussion</strong>.</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Healthcare -->\n<div class=\"modal\" id=\"modal-health\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Healthcare Analytics · BI Visualization · Service Planning</div>\n<div class=\"modal-head-title\">Healthcare Data Visualization</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2023 Healthcare Data Visualization Competition Honorable Mention · Yonsei University</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Data Processing · BI Visualization · Service Planning</div>\n<ul>\n<li>Prepared an analysis dataset from roughly 300,000 treatment and prescription records from the National Health Insurance Service.</li>\n<li>Used Python to standardize categories, handle missing values and outliers, and convert medical codes into interpretable labels.</li>\n<li>Built Power BI views of disease and prescription patterns by age, gender, region, and year.</li>\n<li>Extended the analysis into a healthcare service concept and reviewed market potential, competitors, and points of differentiation.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Health screening, treatment, and prescription data can reveal a lot about personal health, but complex codes and indicators make them difficult to interpret. This project turned those fragmented records into an integrated dataset, an interactive dashboard, and a personalized healthcare service concept.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Data Processing</div>\n<ul class=\"modal-list\">\n<li>Used health screening, treatment, and prescription data from 2011–2017.</li>\n<li>Standardized variable names and formats across years and handled missing values and outliers.</li>\n<li>Converted age, region, diagnosis codes, and drug codes into understandable categories and labels.</li>\n<li>Used SQL to query and structure the data for analysis.</li>\n</ul>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Health Risk Interpretation</div>\n<p class=\"modal-text\">Instead of showing raw values alone, I grouped each screening metric into <strong>Normal, Borderline, or At Risk</strong>, then combined those signals into an overall health-risk indicator.</p>\n<div class=\"modal-img-slot\"><img alt=\"Health Screening Overview Dashboard\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-01-overview.jpg\"/></div>\n<div class=\"modal-img-caption\">Health screening overview – physical indicators by age, smoking/drinking patterns, and risk-status comparison</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - BI Dashboard</div>\n<p class=\"modal-text\">Built the dashboard with Power BI slicers, KPI cards, decomposition trees, and interactive views so users can compare health patterns by year, region, gender, and age.</p>\n<div class=\"modal-sub\">Dashboard Components</div>\n<ul class=\"modal-list\">\n<li>Health Screening Overview</li>\n<li>Individual Health Risk Analysis</li>\n<li>Major Disease Distribution</li>\n<li>Prescription Distribution</li>\n<li>Regional Health Comparison</li>\n<li>Health Comparison by Age &amp; Gender</li>\n</ul>\n<div class=\"modal-img-slot\"><img alt=\"Regional Health Status Dashboard\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-02-region.jpg\"/></div>\n<div class=\"modal-img-caption\">Regional Health Comparison – province-level map and indicator distributions</div>\n<div class=\"modal-img-slot\"><img alt=\"Individual health risk, disease, and prescription distribution\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-03-detail.jpg\"/></div>\n<div class=\"modal-img-caption\">Individual Health Risk Analysis with diagnosis and prescription distributions</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Dashboard Demo</div>\n<p class=\"modal-text\">▶ Interactive Dashboard Preview</p>\n<video class=\"modal-video\" controls=\"\" preload=\"metadata\" src=\"assets/video/healthcare-dashboard-demo.mp4\"></video>\n<div class=\"modal-img-caption\">Demo 01 – Dashboard filtering and visualization updates</div>\n<video class=\"modal-video\" controls=\"\" preload=\"metadata\" src=\"assets/video/healthcare-dashboard-demo-2.mp4\"></video>\n<div class=\"modal-img-caption\">Demo 02 – Individual health-risk analysis and disease/prescription exploration</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Service Planning - Easy Care</div>\n<p class=\"modal-text\">Based on the dashboard findings, I designed Easy Care to help users interpret complex health results and <strong>turn them into everyday health actions</strong>.</p>\n<p class=\"modal-text\">Reviewed the market and competing services to identify differentiated features and positioning.</p>\n<div class=\"modal-img-slot\"><img alt=\"Easy Care service concept\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-04-easycare.jpg\"/></div>\n<div class=\"modal-img-caption\">Easy Care – Service concept connecting health screening results to everyday health habits</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Insight</div>\n<p class=\"modal-text\">The key lesson was that better healthcare analytics is not about showing more numbers—it is about <strong>translating data into language and states people can understand</strong>.</p>\n<p class=\"modal-text\">Combining multiple screening indicators into one exploratory score also made health status easier to compare at a glance.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/healthcare-data-visualization.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n\n", "ko": "\n<div class=\"lang-toggle\" id=\"langToggle\" aria-label=\"Language selector\">\n  <button type=\"button\" data-lang=\"en\">EN</button>\n  <button type=\"button\" data-lang=\"ko\">한국어</button>\n</div>\n\n<nav>\n<a href=\"#home\">Home</a>\n<a href=\"#about\">About</a>\n<a href=\"#education\">Education</a>\n<a href=\"#skills\">Skills</a>\n<div class=\"nav-drop\">\n<a data-spy=\"research projects activities\" href=\"#research\">Projects</a>\n<div class=\"nav-sub\">\n<a href=\"#research\">01. Research Papers</a>\n<a href=\"#projects\">02. Selected Projects</a>\n<a href=\"#activities\">03. Field Activities</a>\n</div>\n</div>\n<a class=\"only-mobile\" href=\"#research\">Research</a>\n<a class=\"only-mobile\" href=\"#projects\">Projects</a>\n<a class=\"only-mobile\" href=\"#activities\">Activities</a>\n<a href=\"#awards\">Awards</a>\n<a href=\"#conferences\">Conferences</a>\n<a href=\"#certifications\">Certs</a>\n</nav>\n<!-- ══ HERO ══ -->\n<section id=\"home\">\n<div class=\"hero-left\">\n<div class=\"hero-label\">Data Analyst · Data Scientist</div>\n<h1 class=\"hero-name\">\n      Seunghyeon\n      <span class=\"hero-name-last\">Lee.</span>\n</h1>\n<div class=\"hero-rule\"></div>\n<p class=\"hero-desc\">From real-world data to<br/>actionable decisions.</p>\n<div class=\"hero-meta\">\n<span>🎓 M.S. Information Systems @ Yonsei Graduate School of Information</span>\n<span>🎓 B.S. Data Science · Biotechnology @ Yonsei University</span>\n<span>📍 Seoul, South Korea</span>\n</div>\n<div class=\"hero-socials\">\n<a class=\"social-btn\" href=\"https://www.linkedin.com/in/seunghyeon-lee-a156aa310/\" rel=\"noreferrer\" tar "></path></svg>\n        Resume\n      </a>\n</div>\n<div class=\"hero-ctas\">\n<a class=\"btn-primary\" href=\"#research\">View My Work</a>\n<button class=\"btn-ghost btn-mail\" data-d=\"yonsei.ac.kr\" data-u=\"dltmd004\" id=\"mailBtn\" type=\"button\">Contact Me</button>\n</div>\n</div>\n<div class=\"hero-right\">\n<figure class=\"photo-frame\">\n<div class=\"photo-frame-mat\">\n<img alt=\"Seunghyeon Lee\" onerror=\"this.parentElement.classList.add('is-empty')\" src=\"assets/images/profile.jpg\"/>\n</div>\n</figure>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ ABOUT ══ -->\n<section id=\"about\">\n<div class=\"sec-label\">About Me</div>\n<h2>Hi, I'm Seunghyeon</h2>\n<div class=\"about-split fade\">\n<div class=\"about-split-text\">\n<div class=\"about-body\">\n<p>저는 <span class=\"highlight\">실제 데이터를 통해 소비자 행동과 비즈니스를 이해하는 과정</span>에 흥미를 가지고 있습니다.</p>\n<p>문제를 데이터를 통해 구체화하고, 해결책을 도출하고, 실제 의사결정 및 문제 해결로 연결하고 있습니다.</p>\n<p>특히 <span class=\"highlight\">고객 행동, 이커머스, HCI</span>분야에서 AI Agent · ML/DL 예측 모델 개발 · GSI 기반 입지 최적화 · 대시보드 시각화 등의 방법론을 사용하고 있습니다.</p>\n<div class=\"career-timeline\">\n<div class=\"ct-item\">\n<div class=\"ct-dot\"></div>\n<div class=\"ct-year\">2021 – 2025</div>\n<div class=\"ct-label\">연세대학교 미래캠퍼스 (학사)</div>\n<div class=\"ct-desc\">B.S. Data Science &amp; Biotechnology</div>\n</div>\n<div class=\"ct-item ct-item--last\">\n<div class=\"ct-dot ct-dot--accent\"></div>\n<div class=\"ct-year\">2025 – Present</div>\n<div class=\"ct-label\">연세대학교 정보대학원 (석사)</div>\n<div class=\"ct-desc\">M.S. Information Systems</div>\n</div>\n</div>\n</div>\n</div>\n<div class=\"about-split-photo\">\n<div class=\"about-photo-fallback\">ABOUT PHOTO</div>\n<img alt=\"Seunghyeon Lee, Yonsei University graduation\" onerror=\"this.remove()\" src=\"assets/images/about-graduation.jpg\"/>\n<div class=\"about-photo-caption\">Yonsei University · Graduation, 2025</div>\n</div>\n</div>\n<div class=\"block-label\">Research Interests</div>\n<div class=\"interest-row\">\n<span class=\"interest fade\">Customer Behavior</span>\n<span class=\"interest fade\">E-commerce Analytics</span>\n<span class=\"interest fade\">AI Agents</span>\n<span class=\"interest fade\">Human–AI Interaction</span>\n</div>\n<div class=\"block-label\">How I Work</div>\n<p class=\"hiw-intro\">문제를 정의하고 데이터를 검증해, 실행 가능한 해결책으로 연결하는 방식으로 업무를 수행하고 있습니다.</p>\n<p class=\"click-hint\">\n<span aria-hidden=\"true\" class=\"click-hint-icon\">\n<svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\">\n<path d=\"M9 4.5a1.6 1.6 0 0 1 3.2 0v6\"></path>\n<path d=\"M12.2 10.6V9a1.6 1.6 0 0 1 3.2 0v1.9\"></path>\n<path d=\"M15.4 11.2v-.9a1.6 1.6 0 0 1 3.2 0v5.2a5.4 5.4 0 0 1-5.4 5.4h-1.4a5 5 0 0 1-3.9-1.9L5 15.4a1.6 1.6 0 0 1 2.5-2l1.5 1.8\"></path>\n</svg>\n</span>\n    각 단계를 클릭하면 자세한 내용을 확인할 수 있습니다.\n  </p>\n<div class=\"hiw-wrap fade\">\n<div class=\"hiw-list\">\n<div class=\"hiw-item\" onclick=\"toggleHiw(this)\">\n<div class=\"hiw-trigger\">\n<div class=\"hiw-trigger-left\">\n<div class=\"hiw-step\">Step 01. Listen &amp; Frame</div>\n<div class=\"hiw-title\">다양한 관점을 모아 핵심 문제를 정의합니다</div>\n</div>\n<div class=\"hiw-chevron\">⌄</div>\n</div>\n<div class=\"hiw-body\">\n<img alt=\"핀테크 기업 탐방 및 프로젝트 논의 회의\" class=\"hiw-item-photo\" loading=\"lazy\" src=\"assets/images/how-01.jpg\"/>\n<div class=\"hiw-body-inner\">사용자·실무자·연구자의 관점을 함께 살펴보고, 서로 다른 요구를 정리해 프로젝트의 핵심 문제와 방향을 정의합니다.</div>\n</div>\n</div>\n<div class=\"hiw-item\" onclick=\"toggleHiw(this)\">\n<div class=\"hiw-trigger\">\n<div class=\"hiw-trigger-left\">\n<div class=\"hiw-step\">Step 02. Analyze &amp; Validate</div>\n<div class=\"hiw-title\">데이터와 현장 근거로 가설을 검증합니다</div>\n</div>\n<div class=\"hiw-chevron\">⌄</div>\n</div>\n<div class=\"hiw-body\">\n<img alt=\"프로젝트 데이터 시각화 자료\" class=\"hiw-item-photo\" loading=\"lazy\" src=\"assets/images/how-02.jpg\"/>\n<div class=\"hiw-body-inner\">정량 분석과 시각화를 통해 문제의 구조를 파악하고, 인터뷰와 실무자 피드백을 함께 검토해 분석 결과가 실제 현장에서도
