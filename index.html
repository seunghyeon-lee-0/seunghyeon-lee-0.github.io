 stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">장려상</div>\n<div class=\"award-name\">2023 의료데이터 시각화 경진대회</div>\n<div class=\"award-meta\"><span class=\"award-org\">연세대학교 SW중심대학사업단</span><span class=\"award-date\">2023.10</span></div>\n<div class=\"award-detail\"><div><p>건강검진·진료·처방 데이터를 통합해 개인의 건강 상태와 위험 요인을 쉽게 탐색할 수 있도록 만든 Power BI 대시보드입니다.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('health')\" type=\"button\">Related Project → Healthcare Data Visualization</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">대상</div>\n<div class=\"award-name\">2023 강원창업오디션 6월대회</div>\n<div class=\"award-meta\"><span class=\"award-org\">(재)강원창조경제혁신센터</span><span class=\"award-date\">2023.06</span></div>\n<div class=\"award-detail\"><div><p>소비와 후원을 연결해 사회적 가치를 만드는 후원 플랫폼 제안 프로젝트입니다.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('moeun')\" type=\"button\">Related Project → 모은 - Social Commerce for Animal Welfare</button></div></div>\n</div>\n<div aria-expanded=\"false\" class=\"award-card fade\" role=\"button\" tabindex=\"0\">\n<span aria-hidden=\"true\" class=\"award-toggle\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" viewbox=\"0 0 24 24\"><path d=\"M6 9.5 12 15.5 18 9.5\"></path></svg></span>\n<div class=\"award-rank\">우수상</div>\n<div class=\"award-name award-name--hl\">Cambridge UK Global Entrepreneurship Camp</div>\n<div class=\"award-meta\"><span class=\"award-org\">University of Cambridge</span><span class=\"award-date\">2023.03</span></div>\n<div class=\"award-detail\"><div><p>영국 현지 인터뷰와 국내 약국 협업을 통해 해외 약국 이용의 언어 장벽을 구체화하고, 이를 다국어 의약품 안내 서비스 프로토타입으로 발전시킨 프로젝트입니다.</p>\n<button class=\"rel-link\" onclick=\"event.stopPropagation();openModal('medi')\" type=\"button\">Related Project → Medi-Changer in the UK</button></div></div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ CONFERENCES & ACTIVITIES ══ -->\n<section id=\"conferences\">\n<div class=\"sec-label\">Conferences &amp; Activities</div>\n<h2>Conferences &amp; Activities</h2>\n<p class=\"sec-sub\">Conferences, communities, and moments that shaped who I am as a researcher.</p>\n<div class=\"block-label\">01. Academic Conference Presentations</div>\n<div class=\"conf-list\">\n<div class=\"conf-card fade\">\n<div class=\"conf-main\">\n<div class=\"ptag\">International Conference · 2026.07</div>\n<h3 class=\"conf-title\">Predicting Abandonment Depth in E-Commerce Purchase Journeys Using Page Transition Structure</h3>\n<p class=\"conf-desc\">클릭스트림의 페이지 전이 구조를 활용해 고객이 구매 여정의 어느 단계에서 이탈하는지 예측한 연구를 발표했습니다.</p>\n</div>\n<div class=\"conf-side\">\n<div class=\"conf-name\">ICBASS 2026</div>\n<div class=\"conf-place\">Fukuoka, Japan</div>\n<span class=\"ptech\">Oral Presentation</span>\n</div>\n</div>\n<div class=\"conf-card fade\">\n<div class=\"conf-main\">\n<div class=\"ptag\">International Conference · 2026.01</div>\n<h3 class=\"conf-title\">Text Mining-Based Analysis and Comparison of Generative, Agentic, and Physical AI</h3>\n<p class=\"conf-desc\">BERTopic 기반 토픽 모델링으로 뉴스와 온라인 커뮤니티 담론을 분석해 AI 유형별 인식 차이를 비교했습니다.</p>\n</div>\n<div class=\"conf-side\">\n<div class=\"conf-name\">ICBSS 2026</div>\n<div class=\"conf-place\">Tokyo, Japan</div>\n<span class=\"ptech\">Oral Presentation</span>\n</div>\n</div>\n</div>\n<div class=\"block-label\">02. Activities</div>\n<div class=\"card-grid\" style=\"margin-top:1.8rem\">\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"Cambridge Global Entrepreneurship Camp\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-cambridge.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">International Program · Cambridge, UK</div>\n<div class=\"pname\">Cambridge Global Entrepreneurship Camp</div>\n<div class=\"pdesc\">영국 현지에서 기업가 강연과 팀 프로젝트에 참여하고, 거리 인터뷰를 통해 사용자 문제를 발견해 비즈니스 아이디어로 구체화했습니다. 이후 프로토타입 제작, 현장 검증, 최종 IR Pitch까지 직접 수행했습니다.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Customer Discovery</span><span class=\"ptech\">Prototyping</span><span class=\"ptech\">IR Pitch</span></div>\n</div>\n</div>\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"모은 프로젝트\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-moeun.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Social Venture Project</div>\n<div class=\"pname\">모은 - Commerce for Animal Welfare</div>\n<div class=\"pdesc\">유기동물 보호소의 재정·홍보 문제를 해결하기 위해 후원 상품을 모아 판매하는 커머스 플랫폼을 기획하고 운영했습니다. 보호소 협약, 브랜드 입점, 펀딩, 플리마켓을 직접 실행하며 소비를 사회적 가치로 연결하는 비즈니스 모델을 검증했습니다.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Partnership</span><span class=\"ptech\">Funding</span><span class=\"ptech\">Business Execution</span></div>\n</div>\n</div>\n<div class=\"pcard fade\">\n<div class=\"pcard-img\">\n<img alt=\"Enactus\" loading=\"lazy\" onerror=\"this.style.display='none'\" src=\"assets/images/act-enactus.jpg\"/>\n</div>\n<div class=\"pcard-body\">\n<div class=\"ptag\">Social Entrepreneurship · Project Activity</div>\n<div class=\"pname\">Enactus : Business for Social Impact</div>\n<div class=\"pdesc\">사회문제를 비즈니스 관점에서 바라보고, 사회적 가치와 지속가능성을 함께 만드는 프로젝트를 기획하고 실행했습니다. 문제 정의부터 아이디어 구체화까지 참여하며 비즈니스를 통해 사회문제를 해결하는 과정을 경험했습니다.</div>\n<div class=\"ptechs\"><span class=\"ptech\">Project Planning</span><span class=\"ptech\">Problem Solving</span><span class=\"ptech\">Team Collaboration</span></div>\n</div>\n</div>\n</div>\n</section>\n<div class=\"divider\"></div>\n<!-- ══ CERTIFICATIONS ══ -->\n<section id=\"certifications\">\n<div class=\"sec-label\">Certifications</div>\n<h2>Credentials</h2>\n<div class=\"certs-grid\">\n<div class=\"cert-card fade\">\n<div class=\"cert-logo\"><img alt=\"한국데이터산업진흥원\" onerror=\"this.parentElement.textContent='K-DATA'\" src=\"assets/images/logo-kdata.png\"/></div>\n<div>\n<div class=\"cert-title\">SQLD - SQL 개발자</div>\n<div class=\"cert-meta\">한국데이터산업진흥원 (K-DATA)</div>\n</div>\n</div>\n<div class=\"cert-card fade\">\n<div class=\"cert-logo\"><img alt=\"한국데이터산업진흥원\" onerror=\"this.parentElement.textContent='K-DATA'\" src=\"assets/images/logo-kdata.png\"/></div>\n<div>\n<div class=\"cert-title\">ADsP - 데이터분석 준전문가</div>\n<div class=\"cert-meta\">한국데이터산업진흥원 (K-DATA)</div>\n</div>\n</div>\n</div>\n</section>\n<footer>\n<div class=\"foot-inner\">\n<span class=\"foot-copy\">© 2026 Seunghyeon Lee</span>\n<div class=\"foot-links\">\n<button class=\"foot-link foot-mail\" data-d=\"yonsei.ac.kr\" data-u=\"dltmd004\" id=\"footMail\" type=\"button\">Email</button>\n<a class=\"foot-link\" href=\"https://github.com/seunghyeon-lee-0\" rel=\"noreferrer\" target=\"_blank\">GitHub</a>\n<a class=\"foot-link\" href=\"https://www.linkedin.com/in/seunghyeon-lee-a156aa310/\" rel=\"noreferrer\" target=\"_blank\">LinkedIn</a>\n<a class=\"foot-link\" href=\"https://velog.io/@idam0424/series\" rel=\"noreferrer\" target=\"_blank\">Blog</a>\n</div>\n<span class=\"build\">build v39</span>\n</div>\n</footer>\n<!-- ══ MODALS ══ -->\n<div id=\"modal-overlay\" onclick=\"closeModal()\"></div>\n<!-- Working Paper 1 -->\n<div class=\"modal\" id=\"modal-paper-churn\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Research Paper 01 · 진행중</div>\n<div class=\"modal-head-title\">Customer Behavior &amp; Churn Analysis</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-img-slot\" style=\"margin-top:0\"><img alt=\"E-commerce Customer Behavior\" onerror=\"this.parentElement.remove()\" src=\"assets/images/thumb-churn.jpg\"/></div>\n<div class=\"ptechs\" style=\"margin:1.1rem 0 0\"><span class=\"ptech\">Customer Behavior</span><span class=\"ptech\">Clickstream</span><span class=\"ptech\">Retention</span><span class=\"ptech\">Customer Segmentation</span><span class=\"ptech\">Churn Prediction</span><span class=\"ptech\">Python</span></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">클릭스트림과 구매 행동 데이터를 활용해 고객이 서비스 안에서 어떤 행동을 보이는지 살펴보고, 이러한 행동이 <strong>구매·재방문·이탈과 어떤 관계를 갖는지</strong> 분석했습니다.</p>\n<p class=\"modal-text\">신규 고객의 초기 행동부터 장기 이용 고객의 행동까지, 고객 생애주기 전반의 패턴을 살펴봤습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research Focus</div>\n<p class=\"modal-text\">다음 세 가지 질문을 중심으로 고객 행동을 분석했습니다.</p>\n<div class=\"modal-sub\">01. 신규 고객의 리텐션에 영향을 주는 초기 행동은 무엇인가?</div>\n<p class=\"modal-text\">신규 고객이 유입된 직후 보이는 행동 중 어떤 패턴이 재방문과 장기 이용으로 이어지는지 분석했습니다.</p>\n<div class=\"modal-sub\">02. 로열 고객은 일반 고객과 어떤 행동 차이를 보이는가?</div>\n<p class=\"modal-text\">구매 빈도와 서비스 이용 행동을 기준으로 고객을 세분화하고, 장기 고객에게 공통적으로 나타나는 행동적 특징을 살펴봤습니다.</p>\n<div class=\"modal-sub\">03. 구매 및 이탈 가능성을 행동 데이터로 사전에 파악할 수 있는가?</div>\n<p class=\"modal-text\">클릭스트림과 구매 이력을 활용해 고객의 향후 구매와 이탈 가능성을 예측할 수 있는지 확인했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Methodology</div>\n<p class=\"modal-text\">클릭스트림과 구매 데이터를 결합해 고객 단위 행동 데이터를 구성했습니다. 이후 고객 세분화와 행동 변수 분석으로 유형별 특성을 비교하고, 머신러닝을 활용해 구매 및 이탈 가능성을 예측했습니다.</p>\n<div class=\"modal-hypothesis\">※ 논문 작성 중인 연구는 세부 방법론과 결과의 공개 범위를 조정하고 있습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Findings</div>\n<p class=\"modal-text\">단순한 구매 결과뿐 아니라 <strong>구매 이전의 행동 패턴</strong>을 함께 보면 고객 관계를 더 세밀하게 이해할 수 있음을 확인했습니다.</p>\n<p class=\"modal-text\">분석 결과는 고객 세분화, 초기 리텐션 관리, 이탈 대응 전략으로 연결할 수 있었습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Status</div>\n<p class=\"modal-text\"><strong>Analysis completed</strong> | Manuscript in preparation</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/customer-behavior-churn-analysis.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Working Paper 2 -->\n<div class=\"modal\" id=\"modal-paper-ai\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Research Paper 02 · 진행중</div>\n<div class=\"modal-head-title\">AI Perception Analysis</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-img-slot\" style=\"margin-top:0\"><img alt=\"AI Perception Analysis\" onerror=\"this.parentElement.remove()\" src=\"assets/images/thumb-ai.jpg\"/></div>\n<div class=\"ptechs\" style=\"margin:1.1rem 0 0\"><span class=\"ptech\">Text Mining</span><span class=\"ptech\">AI Perception</span><span class=\"ptech\">Generative AI</span><span class=\"ptech\">Agentic AI</span><span class=\"ptech\">Physical AI</span></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Generative AI, Agentic AI, Physical AI에 대한 뉴스와 온라인 커뮤니티 담론을 분석해 <strong>AI 유형에 따라 중요하게 인식되는 가치와 이슈가 어떻게 달라지는지</strong> 비교한 연구입니다.</p>\n<p class=\"modal-text\">AI 기술을 성능만으로 바라보기보다, 사회와 실제 사용자가 새로운 AI를 어떻게 이해하고 받아들이는지 함께 살펴보고자 했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research Focus</div>\n<div class=\"modal-sub\">01. AI 유형에 따라 중요하게 인식되는 가치와 이슈는 어떻게 다른가?</div>\n<p class=\"modal-text\">Generative AI, Agentic AI, Physical AI를 구분해 각 기술을 둘러싼 주요 담론을 비교했습니다.</p>\n<div class=\"modal-sub\">02. 뉴스와 사용자 커뮤니티는 AI에 대해 서로 다른 이야기를 하고 있는가?</div>\n<p class=\"modal-text\">뉴스에서 나타나는 거시적 사회 담론과 온라인 커뮤니티의 실제 사용자 경험을 비교했습니다.</p>\n<div class=\"modal-sub\">03. 서로 다른 AI 기술에 대한 인식을 하나의 구조 안에서 비교할 수 있는가?</div>\n<p class=\"modal-text\">각 AI 유형에서 나타나는 가치와 이슈를 같은 기준으로 비교할 수 있는 분석 프레임을 구성했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Methodology</div>\n<p class=\"modal-text\">뉴스 기사와 온라인 커뮤니티 데이터를 수집·전처리한 뒤, <strong>BERTopic</strong>으로 주요 토픽을 추출했습니다. SentenceTransformers · UMAP · HDBSCAN을 활용해 대규모 텍스트 담론의 구조를 분석했습니다.</p>\n<p class=\"modal-text\">이후 AI 유형과 데이터 출처별로 주요 가치와 이슈를 비교했습니다.</p>\n<div class=\"modal-hypothesis\">※ 논문 작성 중인 연구는 세부 방법론과 결과의 공개 범위를 조정하고 있습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Findings</div>\n<p class=\"modal-text\">Generative AI, Agentic AI, Physical AI는 모두 AI 기술에 속하지만, <strong>기술 유형에 따라 중요하게 인식되는 가치와 우려가 서로 다르게</strong> 나타났습니다.</p>\n<p class=\"modal-text\">뉴스에서 형성되는 사회적 담론과 온라인 커뮤니티의 사용자 경험 사이에서도 차이가 나타났습니다. 이를 통해 AI에 대한 사회적 인식과 실제 사용자 경험을 함께 살펴볼 필요가 있음을 확인했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Status</div>\n<p class=\"modal-text\"><strong>Analysis completed</strong> | Manuscript in preparation</p>\n<p class=\"modal-text\">2026년 1월 ICBSS 2026(Tokyo, Japan)에서 발표했습니다.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/ai-perception-analysis.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- TwinCept -->\n<div class=\"modal\" id=\"modal-twincept\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Smart Manufacturing · Explainable AI</div>\n<div class=\"modal-head-title\">TwinCept: Explainable Factory AI</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2026 춘계 대학(원)생 아이디어 공모전 최우수상 · 한국디지털산업학회 × 한국스마트미디어학회</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Service Planning · Data Structure Design · Prototype Design</div>\n<ul>\n<li>제조 현장에서 AI를 활용하기 어려운 지점을 분석하고 서비스의 핵심 기능을 정의했습니다.</li>\n<li>제조 데이터와 관리자의 의사결정 기준을 연결하는 정보 구조를 설계했습니다.</li>\n<li>시나리오 비교와 관리자 개입 기능을 포함한 대시보드 프로토타입을 설계했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">스마트팩토리에서는 AI가 생산 일정과 설비 운영 방안을 제안하지만, <strong>판단 근거와 대안이 충분히 설명되지 않아 실제 의사결정에 활용하기 어렵습니다.</strong></p>\n<p class=\"modal-text\">TwinCept는 복잡한 제조 데이터를 설비 건강도·품질 리스크·납기 여유도처럼 관리자가 이해할 수 있는 판단 기준으로 바꿉니다. 이를 바탕으로 여러 대응 시나리오와 예상 결과를 함께 제시해, 관리자가 상황에 맞는 방안을 선택할 수 있도록 설계했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Manufacturing Data Mapping</div>\n<p class=\"modal-text\">실제 제조기업이 제공한 생산·품질·설비·재고·물류 데이터의 구조를 분석했습니다.</p>\n<p class=\"modal-text\">설비 진동·생산량·비가동 시간·불량 발생 등의 데이터를 <strong>설비 건강도, 품질 리스크, 자재 공급 안정성, 라인 가동 효율, 납기 여유도</strong>라는 다섯 가지 판단 기준으로 연결했습니다.</p>\n<p class=\"modal-text\">복잡한 센서와 공정 데이터를 관리자가 바로 이해할 수 있는 운영 정보로 바꿨습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"AI 예측 · 관리자 개입 · 갱신된 예측\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-01-mapping.jpg\"/></div>\n<div class=\"modal-img-caption\">AI Prediction → Manager Intervention → Updated Prediction - 관리자가 판단 기준을 직접 조정하면 예측이 갱신되는 구조</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Scenario-Based Decision Design</div>\n<p class=\"modal-text\">설비 이상이나 생산 지연이 발생했을 때 하나의 최적해만 제시하는 대신, <strong>운영 목적이 다른 여러 대응 시나리오를 비교</strong>할 수 있도록 설계했습니다.</p>\n<p class=\"modal-text\">DES와 DRL을 활용한 시나리오 엔진 구조를 제안하고, 각 선택지의 납기 달성 가능성·비용·품질·설비 위험을 함께 비교할 수 있도록 구성했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"단일 최적해 대비 복수 시나리오 비교\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-02-scenario.jpg\"/></div>\n<div class=\"modal-img-caption\">기존 단일 최적해(블랙박스) → 복수 시나리오 + KPI 기반 투명한 의사결정</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Interactive Dashboard</div>\n<p class=\"modal-text\">관리자가 주요 판단 기준과 생산 시나리오를 한 화면에서 비교할 수 있는 대시보드 프로토타입을 제작했습니다.</p>\n<p class=\"modal-text\">관리자는 시나리오별 예상 결과와 추천 근거를 비교하고, 현장 상황에 맞게 판단 기준을 수정해 결과가 어떻게 달라지는지 확인할 수 있습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Digital Twin DSS 대시보드\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/twincept-03-dashboard.jpg\"/></div>\n<div class=\"modal-img-caption\">Digital Twin DSS - CBM 지표, 시나리오 비교, 관리자 개입 패널을 한 화면에 구성</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">TwinCept는 제조 AI의 결과를 <strong>관리자가 이해할 수 있는 판단 기준과 비교 가능한 선택지</strong>로 바꿨습니다.</p>\n<p class=\"modal-text\">이를 통해 관리자가 납기·비용·품질·설비 위험의 차이를 비교하고, 현장 경험을 반영해 최종 결정을 내릴 수 있는 AI 의사결정 지원 구조를 제안했습니다.</p>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- PinFit -->\n<div class=\"modal\" id=\"modal-pinfit\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Credit Risk Modeling · Graph Learning</div>\n<div class=\"modal-head-title\">Graph-Based Credit Scoring</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink\" href=\"https://www.fsc.go.kr/no010101/85933\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>금융위원회 보도자료 ↗</a>\n<a class=\"mlink\" href=\"https://www.newsworks.co.kr/news/articleView.html?idxno=824393\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>뉴스웍스 보도자료 ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2025 D-테스트베드 사업 최우수상 · 한국핀테크지원센터</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Credit Risk Analysis · Graph Modeling</div>\n<ul>\n<li>기존 신용평가 모델과 GAT 모델의 성능을 비교했습니다.</li>\n<li>Attention 값을 활용해 주요 변수와 변수 간 상호작용을 확인했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">기존 신용평가는 카드 사용이나 대출 등 과거 금융거래 이력에 크게 의존합니다. 이 때문에 <strong>상환 능력이 있어도 금융이력이 부족한 고객은 충분히 평가받기 어렵습니다.</strong></p>\n<p class=\"modal-text\">금융데이터와 통신 이용 정보를 결합하고, 변수 간 관계를 학습하는 <strong>GAT(Graph Attention Network)</strong> 기반 신용평가 모델을 개발했습니다.</p>\n<p class=\"modal-text\">기존 머신러닝 모델과 성능을 비교하고, Attention 값을 활용해 모델이 어떤 변수와 관계를 중요하게 봤는지 확인할 수 있도록 설계했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"최종 파이프라인\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-04-pipeline.jpg\"/></div>\n<div class=\"modal-img-caption\">최종 파이프라인</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Data Processing</div>\n<p class=\"modal-text\">카드 이용·대출·연체·자산·소득 등 금융데이터와 통신 멤버십 정보를 결합해 분석 데이터셋을 구축했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"사용 데이터셋 구성\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-01-dataset.jpg\"/></div>\n<div class=\"modal-img-caption\">신한카드 컨소시엄 데이터셋 - 금융 이용 정보와 통신 멤버십 정보를 결합</div>\n<p class=\"modal-text\">결측치와 이상치를 정제하고 로그 변환으로 치우친 변수 분포를 보정했습니다. 연체 고객이 전체의 약 <strong>2.2%</strong>에 불과한 클래스 불균형 문제는 10-Fold Cross Validation과 SMOTE로 완화했습니다.</p>\n<p class=\"modal-text\">통계 검정과 Information Value를 활용해 예측력이 낮은 변수를 제거하고, WoE 기반 Fine Classing과 Coarse Classing을 적용해 변수의 안정성과 해석 가능성을 높였습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"데이터 처리 및 피처 엔지니어링\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-02-processing.jpg\"/></div>\n<div class=\"modal-img-caption\">Data Processing &amp; Feature Engineering</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Baseline Modeling</div>\n<p class=\"modal-text\">GAT 모델과 비교할 기준선으로 <strong>Logistic Regression, Random Forest, XGBoost</strong>를 구축했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"채택 모델 비교\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-06-models.jpg\"/></div>\n<div class=\"modal-img-caption\">채택 모델 - 모델별 특성과 선택 근거</div>\n<div class=\"modal-img-slot\"><img alt=\"Baseline Model Performance\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-03-baseline.jpg\"/></div>\n<div class=\"modal-img-caption\">Baseline Model Performance - XGBoost &gt; Random Forest &gt; Logistic Regression</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Graph-Based Credit Modeling</div>\n<p class=\"modal-text\">금융이력이 부족하더라도 변수 간 관계를 활용할 수 있도록 GAT 기반 신용평가 모델을 구성했습니다.</p>\n<p class=\"modal-text\">각 변수를 <strong>노드</strong>로, 변수 간 상호작용을 <strong>엣지</strong>로 표현했습니다. GAT는 Attention을 통해 중요한 관계에 더 높은 가중치를 두고 고객의 신용위험을 예측합니다.</p>\n<p class=\"modal-text\">이를 통해 금융·비금융 변수를 개별적으로 보는 기존 방식과 달리, 여러 변수의 복합적인 관계를 함께 반영했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 04 - Explainable Credit Assessment</div>\n<p class=\"modal-text\">예측값뿐 아니라 <strong>왜 이런 결과가 나왔는지 확인할 수 있도록</strong> 설명 가능성 분석을 수행했습니다.</p>\n<p class=\"modal-text\">GAT의 Attention 값을 활용해 예측에 크게 기여한 변수와 변수 간 관계를 식별하고, 이를 그래프로 시각화해 어떤 정보가 위험 판단에 영향을 미쳤는지 확인할 수 있도록 했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 01 - Model Performance</div>\n<p class=\"modal-text\">GAT는 기준 모델 중 성능이 가장 높았던 XGBoost보다 모든 주요 평가지표에서 더 좋은 결과를 보였습니다.</p>\n<table class=\"modal-table\">\n<tr><th>Model</th><th>Accuracy</th><th>Recall</th><th>F1-score</th><th>AUROC</th><th>KS</th></tr>\n<tr><td>XGBoost</td><td>0.87</td><td>0.70</td><td>0.77</td><td>0.87</td><td>0.59</td></tr>\n<tr class=\"row-hl\"><td>GAT</td><td>0.91</td><td>0.82</td><td>0.86</td><td>0.92</td><td>0.71</td></tr>\n</table>\n<p class=\"modal-text\" style=\"margin-top:1.4rem\">특히 위험 고객 탐지 성능을 나타내는 <strong>Recall이 0.70에서 0.82로 향상</strong>됐고, 기존 모델이 놓쳤던 씬파일러의 위험 패턴을 추가로 포착할 수 있었습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 02 - Explainable Risk Assessment</div>\n<p class=\"modal-text\">Attention Graph를 통해 신용위험 예측에 중요한 변수와 변수 간 관계를 확인할 수 있도록 구성했습니다.</p>\n<p class=\"modal-text\">예측값과 함께 판단 근거를 제시해 <strong>금융기관의 신용심사, 내부 검증, 리스크 관리</strong>에 활용할 수 있도록 했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Self-Attention Map과 Attention Graph\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/pinfit-05-results.jpg\"/></div>\n<div class=\"modal-img-caption\">Self-Attention Map · Attention Graph - 예측에 크게 기여한 변수와 변수 간 관계를 시각화</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">금융이력 부족을 곧 낮은 신용도로 판단하는 기존 방식에서 벗어나, <strong>금융·비금융 데이터 간 관계를 활용해 고객의 상환 가능성을 평가하는 방법</strong>을 제안했습니다.</p>\n<ul class=\"modal-list\">\n<li>기존 모델이 놓친 잠재 우량고객 발굴</li>\n<li>금융기관의 고객 기반 확대</li>\n<li>위험 고객 탐지 성능 향상</li>\n<li>신용심사와 내부 리스크 관리 지원</li>\n<li>모델 설명력 확보를 통한 규제 대응 강화</li>\n</ul>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- 모은 -->\n<div class=\"modal\" id=\"modal-moeun\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Field Research · Social Commerce · Funding &amp; Offline Sales</div>\n<div class=\"modal-head-title\">모은 - Social Commerce for Animal Welfare</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Contribution</div>\n<div class=\"modal-role-sub\">Field Research · Social Media · Funding &amp; Flea Market</div>\n<ul>\n<li>유기동물 보호소를 방문해 봉사활동에 참여하고, 현장의 운영·홍보 문제를 직접 확인했습니다.</li>\n<li>인스타그램 콘텐츠와 플리마켓을 통해 프로젝트를 알리고, 실제 소비자 반응을 확인했습니다.</li>\n<li>보호소 협업 상품의 펀딩을 진행해 소비와 후원을 연결하는 비즈니스 모델을 검증했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">모은은 유기동물 보호소를 후원하는 상품을 한곳에 모아 판매하고, <strong>후원 내역과 보호소 소식을 함께 전달</strong>하는 소셜 커머스 프로젝트입니다.</p>\n<p class=\"modal-text\">보호소의 재정·홍보 문제와 소비자가 느끼는 후원 정보의 불투명성을 함께 해결하고자, 현장 조사부터 SNS 운영, 플리마켓, 펀딩까지 다양한 방식으로 비즈니스 모델을 검증했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Finding the Real Problem</div>\n<p class=\"modal-text\">유기동물 보호소를 직접 방문해 봉사활동에 참여하고, 운영 환경과 보호소 관계자들이 겪는 어려움을 살펴봤습니다.</p>\n<p class=\"modal-text\">전국 국가관리 보호소 <strong>209곳</strong>을 대상으로 인터뷰와 니즈 조사를 진행한 결과, 재정 문제뿐 아니라 <strong>입양·임시보호·후원 상품을 지속적으로 알리는 데에도 어려움</strong>이 있음을 확인했습니다.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"보호소 봉사활동\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-01-volunteer.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"보호소 현장\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-02-shelter.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 01 · Shelter Field Research</strong> - 현장을 직접 방문해 보호소가 겪는 문제를 확인하고 프로젝트의 방향을 구체화했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">From Awareness to Action</div>\n<p class=\"modal-text\">인스타그램으로 보호소 소식과 프로젝트 활동을 알리고, 플리마켓에서는 후원 상품을 직접 소개·판매하며 소비자 반응을 확인했습니다.</p>\n<p class=\"modal-text\">그 결과 SNS 팔로워는 약 <strong>300% 증가</strong>했고, 플리마켓에서는 예상 판매액의 <strong>160%</strong>를 달성했습니다.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"플리마켓 부스\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-03-flea1.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"플리마켓 현장\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-04-flea2.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 02 · Market Validation</strong> - 온라인 콘텐츠와 오프라인 판매를 통해 사회적 가치가 실제 관심과 구매로 이어질 수 있는지 확인했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Running the Funding Campaign</div>\n<p class=\"modal-text\">협약을 맺은 보호소의 유기견을 모티브로 캐릭터와 상품을 기획하고 펀딩을 진행했습니다. 이를 통해 일회성 후원을 넘어 <strong>상품 구매가 보호소 지원으로 이어지는 구조</strong>를 실험했습니다.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"크라우드펀딩 페이지\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-05-funding.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"협업 굿즈\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-06-goods.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\"><strong>Evidence 03 · Crowdfunding</strong> - 보호소 협업 상품을 직접 기획하고 펀딩하며 소셜 커머스 모델의 가능성을 검증했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Validation</div>\n<div class=\"modal-stats-row\">\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">209</div><div class=\"modal-stat-label\">보호소 니즈 조사</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">160%</div><div class=\"modal-stat-label\">플리마켓 예상 판매액 대비 실적</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">300%</div><div class=\"modal-stat-label\">SNS 팔로워 성장</div></div>\n<div class=\"modal-stat\"><div class=\"modal-stat-num\">MOU</div><div class=\"modal-stat-label\">유기동물 보호소 협업</div></div>\n</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Takeaway</div>\n<p class=\"modal-text\">사회적 가치를 만들기 위해서는 좋은 아이디어뿐 아니라 <strong>사람들이 실제로 참여할 수 있는 접점과 지속 가능한 운영 구조</strong>가 필요하다는 점을 배웠습니다.</p>\n<p class=\"modal-text\">보호소 현장에서 문제를 확인한 뒤 SNS로 알리고, 플리마켓과 펀딩을 통해 실제 소비로 연결해보며 사회문제를 비즈니스 방식으로 실행하고 검증하는 과정을 경험했습니다.</p>\n<div class=\"sdg-block\">\n<img alt=\"SDGs 3 · 11 · 15\" onerror=\"this.parentElement.remove()\" src=\"assets/images/moeun-07-sdgs.png\"/>\n</div>\n<div class=\"partner-block\">\n<div class=\"partner-label\">함께 협력한 기관</div>\n<div class=\"partner-logos partner-logos--wide\">\n<img alt=\"꽃길걷개 · OPENKNOWL · 강원지역혁신플랫폼 · 강원창조경제혁신센터\" onerror=\"this.remove()\" src=\"assets/images/partner-moeun.png\"/>\n</div>\n</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Medi-Changer -->\n<div class=\"modal\" id=\"modal-medi\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Field Research · Pharmacy Collaboration · Service Prototyping</div>\n<div class=\"modal-head-title\">Medi-Changer in the UK</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 Cambridge UK Global Entrepreneurship Camp 우수상 · University of Cambridge</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Contribution</div>\n<div class=\"modal-role-sub\">Data Research · Market Research · Field Validation</div>\n<ul>\n<li>영국 현지에서 거리 인터뷰와 시장조사를 진행했습니다.</li>\n<li>약국 협업 과정에서 얻은 사용자·실무자 피드백을 정리했습니다.</li>\n<li>조사 결과를 문제 정의·서비스 기능·프로토타입으로 구체화했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">Medi-Changer는 해외여행 중 언어 장벽과 낯선 의약품 정보로 약국 이용에 어려움을 겪는 사람들을 위한 <strong>다국어 의약품 안내 서비스</strong>입니다.</p>\n<p class=\"modal-text\">영국 창업 프로그램에서 현지 사용자를 인터뷰하고, 국내 약국과의 협업으로 문제를 구체화해 서비스 프로토타입으로 발전시켰습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Finding the Real Problem</div>\n<p class=\"modal-text\">해외에서 아팠던 경험, 약국 이용 시 겪은 불편, 의약품 정보를 찾는 방식과 서비스 이용 의향을 파악하기 위해 영국 현지에서 거리 인터뷰를 진행했습니다.</p>\n<p class=\"modal-text\">인터뷰를 통해 문제는 단순한 번역을 넘어, <strong>증상을 정확히 전달하기 어렵고 현지 의약품을 익숙한 약과 비교하기 어렵다</strong>는 점에 있음을 확인했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Street Interviews in the UK\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-01-interview.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 01 · Street Interviews in the UK</strong> - 영국 현지 사용자를 대상으로 해외 약국 이용 경험과 의약품 정보 탐색 과정, 서비스 이용 의향을 조사했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Field Validation with Pharmacies</div>\n<p class=\"modal-text\">사용자 관점에 그치지 않고 실제 약국과 협업해 <strong>외국인 고객 응대 과정과 복약 안내 방식</strong>도 현장에서 확인했습니다.</p>\n<p class=\"modal-text\">흥업온누리약국과 명동약국에서 증상 표현 자료와 복약 안내를 실제로 활용하고, <strong>약사 피드백</strong>을 바탕으로 증상 분류와 안내 문구를 보완했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Pharmacy Collaboration\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-02-pharmacy.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 02 · Pharmacy Collaboration</strong> - 실제 약국 환경에서 증상 전달과 복약 안내 과정을 확인하고, 사용자와 약사 양쪽의 요구를 서비스 구조에 반영했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Building the Prototype</div>\n<p class=\"modal-text\">현장 조사 결과를 바탕으로 사용자가 증상을 시각적으로 전달하고, 현지 일반의약품을 스캔해 익숙한 의약품과 비교할 수 있는 프로토타입을 설계했습니다.</p>\n<ul class=\"modal-list\">\n<li>신체 부위와 증상을 선택하는 시각형 증상 보드</li>\n<li>일반의약품 스캔 및 성분 정보 확인</li>\n<li>국가별 유사 의약품 정보 제공</li>\n<li>사용자와 약사를 위한 다국어 복약 안내</li>\n</ul>\n<div class=\"modal-img-slot\"><img alt=\"Service Prototype\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-03-prototype.jpg\"/></div>\n<div class=\"modal-img-caption\"><strong>Evidence 03 · Service Prototype</strong> - 거리 인터뷰와 약국 협업에서 발견한 문제를 실제 사용 흐름과 주요 기능으로 구체화했습니다.</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Research at a Glance</div>\n<p class=\"modal-text\">서비스 컨셉을 검증하기 위해 한국과 영국에서 현장 조사를 진행했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Research at a Glance\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/medi-04-research.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Key Takeaway</div>\n<p class=\"modal-text\">자료만으로는 사용자의 문제를 충분히 이해하기 어려웠습니다. <strong>현장에서 사용자를 만나고 약국의 업무 과정을 확인하면서 초기 가정을 수정</strong>했고, 실제 사용 맥락에 맞는 서비스 기능으로 발전시킬 수 있었습니다.</p>\n<div class=\"partner-block\">\n<div class=\"partner-label\">함께 협력한 기관</div>\n<div class=\"partner-logos partner-logos--wide\">\n<img alt=\"국민건강보험공단 · 건강보험심사평가원 · 강원도\" onerror=\"this.remove()\" src=\"assets/images/partner-medi.png\"/>\n</div>\n</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Flood -->\n<div class=\"modal\" id=\"modal-flood\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Climate Risk · Spatial Analysis · Insurance Design</div>\n<div class=\"modal-head-title\">Flood Risk Modeling</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink mlink--gh\" href=\"https://github.com/seunghyeon-lee-0/flood-risk-insurance-model\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"currentColor\" viewbox=\"0 0 24 24\"><path d=\"M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.1 5.1 18 5.4 18 5.4c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3\"></path></svg>GitHub Repository ↗</a>\n<a class=\"mlink\" href=\"https://www.newsdream.kr/news/articleView.html?idxno=86727\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.8\" viewbox=\"0 0 24 24\"><path d=\"M4 6h11a1 1 0 0 1 1 1v11H6a2 2 0 0 1-2-2V6Z\"></path><path d=\"M16 9h3a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 9h5M7 12h5M7 15h3\"></path></svg>보도자료 ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 삼성화재 × POSTECH × 서울대학교 제3회 전국 대학생 리스크 관리 경진대회 장려상 · 2025</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Spatial Data Analysis · Risk Modeling</div>\n<ul>\n<li>ArcGIS를 활용해 Landsat 위성 및 공간 데이터를 전처리하고, 지역별 홍수 관련 지표를 시각화했습니다.</li>\n<li>Python을 활용해 분석 변수의 중요도와 가중치를 산출했습니다.</li>\n<li>전처리된 데이터와 가중치 분석 결과를 통합해 서울시 자치구별 최종 홍수 위험 점수를 산출했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">기후변화로 과거에는 피해가 크지 않았던 지역에서도 극한 강우와 침수 피해가 발생하면서, <strong>기존의 정적인 홍수 위험 평가만으로는 실제 지역 위험을 충분히 설명하기 어렵다</strong>는 문제에서 시작했습니다.</p>\n<p class=\"modal-text\">서울을 대상으로 평상시와 집중호우 상황의 홍수 위험 변화를 비교하고, 지역의 취약성과 재난 대응 역량을 함께 고려하는 위험 평가 체계를 설계했습니다.</p>\n<div class=\"modal-sub modal-sub--gap\">EDA</div>\n<div class=\"modal-img-trio\">\n<div class=\"modal-img-slot\"><img alt=\"2020·2022년 자치구별 방어역량 및 피해액\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-1.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"2022년 자치구별 방어역량 및 피해액\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-2.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"2020년 자치구별 방어역량 및 피해액\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-eda-3.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\">자치구별 방어역량 대비 피해액 - 방어역량이 높은 자치구에서도 큰 피해가 관측됨</div>\n<div class=\"modal-img-slot\"><img alt=\"From flood risk to insurance design\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-02-pipeline.jpg\"/></div>\n<div class=\"modal-img-caption\">전체 파이프라인: 공공·위성데이터 → FVI · FDI 산출 → 2020 vs 2022 비교 → 리스크 구역 분류 → 보험 설계</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Data &amp; Preprocessing</div>\n<div class=\"modal-sub\">데이터 구성</div>\n<ul class=\"modal-list\">\n<li><strong>Landsat 8 위성 데이터</strong> - 서울 지역의 식생·도시화 수준과 지표면 온도를 공간 단위로 파악하기 위한 위성영상 데이터</li>\n<li><strong>기상청 장마·강수 데이터</strong> - 1961~2024년 장마 기간과 강수량을 비교해 평시와 집중호우 상황을 구분하기 위한 기후 데이터</li>\n<li><strong>자치구별 방어용량 데이터</strong> - 제방·유수지·배수펌프장 등 지역별 홍수 방어 인프라와 대응 역량을 나타내는 데이터</li>\n<li><strong>홍수 피해 데이터</strong> - 자치구별 피해금액, 침수세대 수, 피해 인구를 통해 실제 홍수 피해 수준을 측정한 데이터</li>\n</ul>\n<div class=\"modal-sub modal-sub--gap\">데이터 전처리</div>\n<p class=\"modal-text\">Landsat 8 위성영상의 DN 값을 Radiance와 Brightness Temperature로 변환한 뒤, 밴드 조합을 통해 <strong>NDVI · NDBI · LST</strong> 등의 공간 지표를 산출했습니다.</p>\n<p class=\"modal-text\">자치구 단위로 데이터를 통합한 뒤 결측치 보간, 면적 기준 표준화, 지표 정규화를 거쳐 지역별 홍수 취약성과 대응 역량을 비교할 수 있는 분석 데이터셋을 구축했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"NDVI · NDBI · LST 시각화\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-09-indices.jpg\"/></div>\n<div class=\"modal-img-caption\">NDVI(정규식생지수) · NDBI(정규도시화지수) · LST(지표면 온도) 시각화 결과</div>\n<div class=\"modal-img-slot\"><img alt=\"Radiance · BT · NDVI · Pv · NDBI 산출식\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-10-formula1.jpg\"/></div>\n<div class=\"modal-img-slot modal-img-slot--xs\"><img alt=\"LST 산출식\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-11-formula2.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Risk Index Design</div>\n<p class=\"modal-text\">공공데이터와 위성데이터를 활용해 실제 홍수 피해와 관련된 변수를 분석하고, 지역의 위험을 <strong>취약성</strong>과 <strong>대응 역량</strong> 두 축으로 재구성했습니다.</p>\n<div class=\"modal-sub\">FVI - Flood Vulnerability Index</div>\n<p class=\"modal-text\">지역의 홍수 취약성을 나타내는 지표입니다. 실제 피해 수준, 인구·가구 밀도, 불투수면 비율 등 홍수 피해 가능성과 관련된 변수를 활용했습니다.</p>\n<div class=\"modal-sub\">FDI - Flood Defense Infrastructure Index</div>\n<p class=\"modal-text\">지역의 홍수 대응 역량을 나타내는 지표입니다. 방재시설, 하수도 네트워크, 재정자립도, 소방 인력 등 홍수 피해 대응 능력을 보여주는 요소를 활용했습니다.</p>\n<div class=\"modal-hypothesis\">각 지표의 변수 가중치는 전문가 기반 AHP 분석으로 산출했습니다.</div>\n<div class=\"modal-img-slot\"><img alt=\"FVI and FDI indicators\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-03-indicators.jpg\"/></div>\n<div class=\"modal-img-caption\">FVI · FDI 지표 구성과 변수별 산식, GIS 지표 맵</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Dynamic Risk Classification</div>\n<p class=\"modal-text\">기존 PCD Matrix는 지역의 홍수 방어 역량과 실제 피해를 기준으로 지역을 네 가지 유형으로 분류합니다. 2020년과 2022년을 비교한 결과 <strong>일부 지역에서는 기존 위험 분류와 실제 피해가 일치하지 않는 경우</strong>가 나타났습니다.</p>\n<p class=\"modal-text\">이를 바탕으로 정적인 위험 분류에서 벗어나, 평상시와 극한 강우 상황에서 위험이 어떻게 달라지는지를 함께 고려하는 <strong>동적 위험 분류 체계</strong>를 구성했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Baseline PCD Matrix 2020 vs 2022\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/flood-04-pcd.jpg\"/></div>\n<div class=\"modal-img-caption\">PCD Matrix - 🔴 Dangerous · 🟠 Mess · 🟢 Safe · 🔵 Well-Protected (2020 vs 2022)</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 01 - Flood Risk Classification</div>\n<p class=\"modal-text\">지역을 평상시와 극한 강우 상황에서의 위험 변화에 따라 네 가지 유형으로 구분했습니다.</p>\n<table class=\"modal-table\">\n<tr><th>Risk Type</th><th>Compensation Structure</th></tr>\n<tr><td>Stable</td><td>Linear indemnity based on actual loss</td></tr>\n<tr><td>Latent-Risk</td><td>Stepwise payout using multiple rainfall triggers</td></tr>\n<tr><td>Chronic-Risk</td><td>Combined stepwise and proportional-cap structure</td></tr>\n<tr><td>Misclassified</td><td>Initial advance payment followed by loss-based adjustment</td></tr>\n</table>\n<p class=\"modal-text\" style=\"margin-top:1.1rem\">특히 기존의 정적 평가만으로는 찾기 어려웠던 <strong>잠재위험 지역(Latent-Risk)</strong>을 식별했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 02 - Risk-Based Pricing</div>\n<p class=\"modal-text\">FVI 기반 최종 위험도를 자치구별 <strong>Risk Coefficient</strong>로 변환해 보험료 산정에 활용할 수 있도록 했습니다. 위험 순위에 따라 계수를 1.00–1.96 범위로 차등화해, 위험도가 높은 지역일수록 더 높은 계수가 반영되도록 설계했습니다.</p>\n<div class=\"modal-formula\">risk_coefficient = 1.00 + 0.04 × (25 − rank)</div>\n<table class=\"modal-table\">\n<tr><th>Rank</th><th>District</th><th>FVI 2020</th><th>FVI 2022</th><th>Final FVI</th><th>Risk Coefficient</th></tr>\n<tr><td>1</td><td>Gangdong-gu</td><td>0.150649</td><td>0.028418</td><td>0.113980</td><td>1.96</td></tr>\n<tr><td>2</td><td>Yeongdeungpo-gu</td><td>0.049914</td><td>0.104732</td><td>0.066359</td><td>1.92</td></tr>\n<tr><td>3</td><td>Dongjak-gu</td><td>0.037009</td><td>0.111389</td><td>0.059323</td><td>1.88</td></tr>\n<tr><td>4</td><td>Seongbuk-gu</td><td>0.069060</td><td>0.028030</td><td>0.056751</td><td>1.84</td></tr>\n<tr><td>5</td><td>Gwanak-gu</td><td>0.034631</td><td>0.091641</td><td>0.051734</td><td>1.80</td></tr>\n</table>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Result 03 - Insurance &amp; Compensation Design</div>\n<p class=\"modal-text\">모든 지역에 같은 보상 구조를 적용하는 대신, 각 위험 유형에 맞는 보상 방식을 설계했습니다.</p>\n<div class=\"modal-sub\">Residential Flood Insurance</div>\n<table class=\"modal-table\">\n<tr><th>Type</th><th>Building</th><th>Contents</th><th>Deductible</th><th>Target</th></tr>\n<tr><td>Basic</td><td>KRW 200M</td><td>KRW 50M</td><td>KRW 1M</td><td>Detached and older urban housing</td></tr>\n<tr><td>Premium</td><td>KRW 300M</td><td>KRW 100M</td><td>KRW 0.5M</td><td>High-value homes or lower-risk districts</td></tr>\n<tr><td>Affordable</td><td>KRW 150M</td><td>KRW 30M</td><td>KRW 2M</td><td>Flood-prone areas and price-sensitive households</td></tr>\n</table>\n<div class=\"modal-sub\">Commercial and Industrial Flood Insurance</div>\n<table class=\"modal-table\">\n<tr><th>Type</th><th>Target</th><th>Building</th><th>Contents</th><th>Deductible</th></tr>\n<tr><td>A</td><td>Small shops and retail stores</td><td>KRW 500M</td><td>KRW 200M</td><td>KRW 1M</td></tr>\n<tr><td>B</td><td>Manufacturing businesses</td><td>KRW 1B</td><td>KRW 500M</td><td>KRW 5M</td></tr>\n<tr><td>C</td><td>Wholesale and logistics facilities</td><td>KRW 700M</td><td>KRW 500M</td><td>KRW 3M</td></tr>\n<tr><td>D</td><td>Basement shops and traditional markets</td><td>KRW 500M</td><td>KRW 200M</td><td>KRW 1M</td></tr>\n</table>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">지역의 홍수 위험을 하나의 정적인 순위로만 보지 않고, <strong>극한 기후 상황에서 위험이 어떻게 달라지는지</strong>를 분석했습니다. 이를 바탕으로 위험 분석을 지역 분류에 그치지 않고 실제 보험요율과 보상 구조 설계까지 연결했습니다.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/flood-risk-modeling.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Shuttle -->\n<div class=\"modal\" id=\"modal-shuttle\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Mobility Planning · Location Optimization · Route Design</div>\n<div class=\"modal-head-title\">Shuttle Bus Location Optimization</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-links\">\n<a class=\"mlink mlink--gh\" href=\"https://github.com/seunghyeon-lee-0/shuttle-stop-location-analysis\" rel=\"noreferrer\" target=\"_blank\"><svg fill=\"currentColor\" viewbox=\"0 0 24 24\"><path d=\"M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.1 5.1 18 5.4 18 5.4c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3\"></path></svg>GitHub Repository ↗</a>\n</div>\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 제12회 2024 빅콘테스트 데이터분석분야 최우수상 · 2024</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Data Analysis · Location Optimization</div>\n<ul>\n<li>입지 분석에 필요한 데이터를 수집하고 분석 가능한 형태로 정리했습니다.</li>\n<li>Python을 활용해 입지 평가 변수의 중요도와 가중치를 산출했습니다.</li>\n<li>MCLP와 P-Median을 활용해 최적 입지 분석을 수행했습니다.</li>\n<li>분석 결과를 바탕으로 정책 활용 가능성과 운영상 시사점을 정리하고, 분석의 한계와 향후 개선 방향을 제안했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">지역 축제 기간에는 방문객과 차량이 특정 지역에 집중되면서 <strong>교통 혼잡과 주차 문제</strong>가 커집니다. 이를 해결하기 위해 유동인구와 교통 패턴을 분석하고, 이용객의 접근성과 운영 효율을 함께 고려한 셔틀버스 운영안을 설계했습니다. 분석은 정류장 입지 선정에서 시작해 운행 권역, 노선, 운영 정책 제안으로 확장했습니다.</p>\n<div class=\"modal-img-pair\">\n<div class=\"modal-img-slot\"><img alt=\"축제 기간 교통 EDA\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-01-eda.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"현지인·외부인 방문 비율\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-02-visitors.jpg\"/></div>\n</div>\n<div class=\"modal-img-caption\">수집 데이터 기반 EDA - 축제 기간 유동인구·통행량 급증 확인</div>\n<p class=\"modal-text\">관람객의 이동 편의와 축제 운영 효율을 높이고, 궁극적으로 <strong>축제 만족도와 지역 활성화에 기여하는 것</strong>을 목표로 했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Analysis Process Overview\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-03-process.jpg\"/></div>\n<div class=\"modal-img-caption\">Analysis Process Overview - 데이터 수집 → 탐색적 분석 → AHP 요인 가중치 → MCLP · P-Median · Greedy 입지 분석 → 군집 기반 노선 설계</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Demand Analysis</div>\n<div class=\"modal-sub\">데이터 구성</div>\n<p class=\"modal-text\">축제 방문 수요와 정류장 접근성에 영향을 주는 다양한 데이터를 수집해 분석했습니다.</p>\n<ul class=\"modal-list\">\n<li><strong>유동인구 데이터</strong> - 통신사 데이터 기반, 축제 기간 시간대별·지역별 인구 집중도</li>\n<li><strong>교통량 데이터</strong> - 도로 구간별 통행량, modal 별 차량 비중</li>\n<li><strong>대중교통 데이터</strong> - 기존 정류장 위치와 노선 커버리지</li>\n<li><strong>관광·상권 데이터</strong> - 주요 목적지 유동인구, 숙박·상업 시설 분포</li>\n<li><strong>공간 데이터</strong> - 행정구역 경계, 도로망, 축제장 위치</li>\n</ul>\n<div class=\"modal-sub modal-sub--gap\">데이터 전처리</div>\n<p class=\"modal-text\">속도 이상치를 제거하고 목적 방문지를 판별한 뒤, 요일·주말 여부와 시간대 등 파생 변수를 생성해 분석용 데이터셋을 구성했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"데이터 전처리 과정\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-04-preprocess.jpg\"/></div>\n<div class=\"modal-img-caption\">변수 생성 및 정제 - 속도 이상치 제거, 목적 방문지 판별, 파생 변수 생성, 좌표계 통일</div>\n<p class=\"modal-text\">이후 <strong>16명의 전문가 설문</strong>을 바탕으로 AHP 분석을 수행해 입지 평가 요소의 중요도를 산출하고, 이를 기준으로 지역별 수요 수준을 정량화했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Location Optimization</div>\n<p class=\"modal-text\">제한된 수의 정류장으로 최대한 많은 수요를 수용하면서 접근성도 확보하기 위해 두 가지 입지 최적화 모델을 적용했습니다.</p>\n<div class=\"modal-hypothesis\">MCLP는 <strong>수요 커버리지와 효율성</strong>을, P-Median은 <strong>접근성</strong>을 우선하는 결과를 각각 보여줍니다.</div>\n<div class=\"modal-sub\">📍 MCLP - Maximal Covering Location Problem</div>\n<p class=\"modal-text\">요인 가중치를 반영해 400m 서비스 반경 안에서 최대한 많은 가중 수요를 커버하는 정류장 조합을 탐색했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"MCLP 수식과 가중치\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-06-mclp.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"MCLP 추가 제약조건 설정\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-12-mclp-constraint.jpg\"/></div>\n<div class=\"modal-img-caption\">읍면동별 최소 정류장 수를 2개로 제한해 400m coverage가 적용되도록 보완</div>\n<div class=\"modal-sub\">📍 P-Median</div>\n<p class=\"modal-text\">각 수요 지점을 선택된 정류장에 할당하고, 수요를 반영한 전체 이동거리 합이 최소가 되는 정류장 조합을 탐색했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"P-Median 수식\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-07-pmedian.jpg\"/></div>\n<div class=\"modal-img-slot\"><img alt=\"P-Median 다목적 최적화 문제와 가중합 방식\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-13-pmedian-issue.jpg\"/></div>\n<div class=\"modal-img-caption\">거리 최소화와 가중치 최대화가 상충하는 문제를 가중합 목적함수(λ=0.5)로 결합</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - Final Bus Stop Selection</div>\n<p class=\"modal-text\">MCLP와 P-Median 결과를 통합해 약 43개의 정류장 후보군을 만들고, 종합 중요도가 높은 후보부터 검토하는 <strong>Greedy Algorithm</strong>을 적용했습니다.</p>\n<p class=\"modal-text\">선정된 정류장 사이에 최소 400m 이상의 간격을 두도록 중복 후보를 제거해, 최종적으로 <strong>22개</strong>의 셔틀버스 정류장을 선정했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Greedy 알고리즘 적용 결과\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-08-greedy.jpg\"/></div>\n<div class=\"modal-img-caption\">근거리 내 서로 겹치는 버스 정류장을 최적화하여 최소화한 22개의 최종 정류장 목록 도출</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 04 - Route Planning</div>\n<p class=\"modal-text\">선정된 22개 정류장의 공간 분포를 기준으로 K-Means와 Hierarchical Clustering을 비교했습니다. <strong>Silhouette Score</strong>를 기준으로 적정 군집 수를 평가한 결과 K=2를 선택했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Silhouette Score 기반 군집 수 선정\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-10-cluster.jpg\"/></div>\n<div class=\"modal-img-caption\">모델 실루엣 점수가 가장 높은 K=2를 채택 - 셔틀버스 노선으로 2개의 코스 운영</div>\n<p class=\"modal-text\">각 11개 정류장으로 구성된 두 개의 셔틀 운행 권역을 나누고, 이를 바탕으로 실제 운행 가능한 노선을 설계했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 05 - Demand &amp; Frequency Planning</div>\n<p class=\"modal-text\">정류장과 노선을 선정한 이후에는 실제 운영까지 연결할 수 있도록 <strong>ML 기반 방문객 수요 예측</strong>과 시간대별 운영 전략을 함께 검토했습니다. 가장 높은 성능을 보인 <strong>XGBoost</strong>의 예측 결과를 바탕으로 시간대별 승객 집중도를 반영한 배차 운영안을 제안했습니다.</p>\n<div class=\"modal-img-slot modal-img-slot--xs\"><img alt=\"시간대별 수요 예측\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-11-demand.jpg\"/></div>\n<div class=\"modal-img-caption\">시간대별 OD 합계 - 승객이 집중되는 구간을 확인해 배차 간격에 반영</div>\n<p class=\"modal-text\">이를 통해 입지와 노선 선정에 그치지 않고, <strong>실제 운영 단계까지 이어지는 분석 구조</strong>를 설계했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"최종 노선과 배차 계획\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/shuttle-09-routes.jpg\"/></div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Impact</div>\n<p class=\"modal-text\">입지 분석을 단순한 최적 위치 선정에 그치지 않고 <strong>실제 축제 운영에 활용할 수 있는 교통 정책</strong>으로 연결했습니다. 수요 커버리지, 이용자 접근성, 공간적 중복, 운영 가능성을 함께 고려했습니다.</p>\n<p class=\"modal-text\">또한 분석 모델의 한계를 정리하고, 향후 실시간 교통 데이터와 방문객 이동 데이터를 활용한 개선 방향을 제안했습니다.</p>\n<div class=\"modal-hypothesis\">분석 결과를 해당 축제 자치구에 전달했으며, 긍정적인 검토를 거쳐 <strong>실행 여부를 논의 중</strong>입니다.</div>\n<div class=\"modal-actions\">\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n<!-- Healthcare -->\n<div class=\"modal\" id=\"modal-health\">\n<div class=\"modal-head\">\n<div>\n<div class=\"modal-head-tag\">Healthcare Analytics · BI Visualization · Service Planning</div>\n<div class=\"modal-head-title\">Healthcare Data Visualization</div>\n</div>\n<button aria-label=\"Close\" class=\"modal-close\" onclick=\"closeModal()\">✕</button>\n</div>\n<div class=\"modal-body\">\n<div class=\"modal-chapter\">\n<p class=\"modal-award\"><strong>🏆 2023 의료데이터 시각화 경진대회 장려상 · 연세대학교</strong></p>\n<div class=\"modal-role\">\n<div class=\"modal-role-label\">My Role</div>\n<div class=\"modal-role-sub\">Data Processing · BI Visualization · Service Planning</div>\n<ul>\n<li>국민건강보험공단의 연도별 진료내역과 의약품 처방 데이터 약 30만 건을 수집해 분석용 데이터셋을 구축했습니다.</li>\n<li>Python을 활용해 변수 범주화, 결측치·이상치 처리, 의료 코드 변환 등 전처리를 수행했습니다.</li>\n<li>Power BI를 활용해 연령·성별·거주지역·측정연도에 따른 주요 질병과 의약품 처방 분포를 시각화했습니다.</li>\n<li>분석 결과를 바탕으로 건강관리 서비스 아이디어를 기획하고, 시장성·경쟁 서비스·차별화 요소를 분석했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter-label\">Overview</div>\n<p class=\"modal-text\">건강검진·진료·의약품 처방 데이터는 개인의 건강 상태를 이해하는 데 유용하지만, 서로 다른 코드와 복잡한 지표로 구성되어 있어 <strong>일반 사용자가 바로 이해하기 어렵습니다.</strong> 이에 데이터를 분석 가능한 형태로 통합하고, 개인의 건강 상태를 쉽게 탐색할 수 있도록 시각화한 뒤 개인 맞춤형 건강관리 서비스 기획으로 확장했습니다.</p>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 01 - Data Processing</div>\n<ul class=\"modal-list\">\n<li>2011년부터 2017년까지의 건강검진·진료내역·의약품 처방 데이터를 활용했습니다.</li>\n<li>연도별로 달랐던 변수명과 데이터 형식을 통일하고, 결측치와 이상치를 처리했습니다.</li>\n<li>연령·지역·질병 코드·의약품 코드처럼 바로 이해하기 어려운 값을 실제 의미를 가진 범주와 명칭으로 변환했습니다.</li>\n<li>SQL을 활용해 필요한 데이터를 조회하고 분석에 활용하기 좋은 형태로 정리했습니다.</li>\n</ul>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 02 - Health Risk Interpretation</div>\n<p class=\"modal-text\">건강검진 결과를 단순한 수치로 보여주는 대신, 각 항목을 <strong>정상·경계·의심</strong> 상태로 범주화했습니다. 각 상태에 점수를 부여하고 여러 검진 항목을 통합해 개인의 전반적인 건강 상태를 탐색할 수 있는 건강위험 지표를 구성했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"건강검진 종합 현황 대시보드\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-01-overview.jpg\"/></div>\n<div class=\"modal-img-caption\">건강검진 종합 현황 - 연령별 신체 지표, 흡연·음주 분포, 건강위험 항목별 상태 비교</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Approach 03 - BI Dashboard</div>\n<p class=\"modal-text\">Power BI의 슬라이서, KPI 카드, 분해트리 등 다양한 기능을 활용해 대시보드를 구성했습니다. 사용자는 기준연도·지역·성별·연령 등의 조건을 선택해 건강 상태를 비교할 수 있습니다.</p>\n<div class=\"modal-sub\">Dashboard Components</div>\n<ul class=\"modal-list\">\n<li>건강검진 종합 현황</li>\n<li>개인별 건강위험 분석</li>\n<li>주요 질병 분포</li>\n<li>의약품 처방 분포</li>\n<li>지역별 건강 상태 비교</li>\n<li>연령 및 성별 건강 상태 비교</li>\n</ul>\n<div class=\"modal-img-slot\"><img alt=\"지역별 건강 상태 대시보드\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-02-region.jpg\"/></div>\n<div class=\"modal-img-caption\">지역별 건강 상태 비교 - 시도 단위 지도와 항목별 분포</div>\n<div class=\"modal-img-slot\"><img alt=\"개인별 건강위험 및 질병·의약품 분포\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-03-detail.jpg\"/></div>\n<div class=\"modal-img-caption\">개인별 건강위험 분석과 주상병·의약품 처방 분포</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Dashboard Demo</div>\n<p class=\"modal-text\">▶ Interactive Dashboard Preview</p>\n<video class=\"modal-video\" controls=\"\" preload=\"metadata\" src=\"assets/video/healthcare-dashboard-demo.mp4\"></video>\n<div class=\"modal-img-caption\">Demo 01 - 대시보드 필터 조작 및 시각화 변화</div>\n<video class=\"modal-video\" controls=\"\" preload=\"metadata\" src=\"assets/video/healthcare-dashboard-demo-2.mp4\"></video>\n<div class=\"modal-img-caption\">Demo 02 - 개인별 건강위험 분석 및 질병·의약품 탐색</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Service Planning - Easy Care</div>\n<p class=\"modal-text\">대시보드 분석 결과를 바탕으로 복잡한 건강검진 결과를 쉽게 이해하고 <strong>일상적인 건강관리 행동으로 연결</strong>할 수 있도록 개인 건강관리 서비스 Easy Care를 기획했습니다.</p>\n<p class=\"modal-text\">관련 시장과 경쟁 서비스를 분석하고, 기존 건강관리 서비스와 비교해 차별화할 수 있는 기능과 방향을 검토했습니다.</p>\n<div class=\"modal-img-slot\"><img alt=\"Easy Care 서비스 기획\" loading=\"lazy\" onerror=\"this.parentElement.remove()\" src=\"assets/images/health-04-easycare.jpg\"/></div>\n<div class=\"modal-img-caption\">Easy Care - 건강검진 결과를 일상 건강 습관으로 연결하는 서비스 기획안</div>\n</div>\n<div class=\"modal-chapter\">\n<div class=\"modal-chapter-label\">Insight</div>\n<p class=\"modal-text\">의료 데이터 분석에서는 많은 수치를 보여주는 것보다 <strong>사용자가 이해할 수 있는 언어와 상태로 데이터를 바꾸는 과정</strong>이 중요했습니다. 질병 코드와 의약품 코드를 실제 질병명과 약물 정보로 변환해 해석 가능성을 높였습니다.</p>\n<p class=\"modal-text\">또한 여러 건강검진 항목을 하나의 탐색 지표로 통합해 사용자가 자신의 건강 상태를 더 직관적으로 비교할 수 있도록 구성했습니다.</p>\n<div class=\"modal-actions\">\n<a class=\"btn-ghost\" href=\"assets/docs/healthcare-data-visualization.pdf\" rel=\"noreferrer\" target=\"_blank\">📄 Full Report (PDF)</a>\n<button class=\"btn-ghost\" onclick=\"closeModal()\" style=\"background:none;cursor:pointer\">← Back</button>\n</div>\n</div>\n</div>\n</div>\n\n"};
  const saved = localStorage.getItem('portfolio-lang');
  const lang = saved === 'ko' ? 'ko' : 'en';
  document.documentElement.lang = lang;
  document.write(bodies[lang]);

  window.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('#langToggle [data-lang]').forEach(function(btn){
      const active = btn.dataset.lang === lang;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');

      btn.addEventListener('click', function(){
        const next = btn.dataset.lang;
        if(next === lang) return;
        localStorage.setItem('portfolio-lang', next);
        location.reload();
      });
    });
  });
})();
</script>
